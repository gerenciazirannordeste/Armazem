<style>
:root{--red:#E11D2D;--red2:#B8141F;--amber:#F59E0B;--dark:#14161A;--dark2:#1D2026;--dark3:#2A2E36;--bg:#F3F4F6;--card:#fff;--tx:#191B1F;--mut:#6B7280;--bd:#E2E4E8;--ok:#15803D;--okbg:#DCFCE7;--wn:#B45309;--wnbg:#FEF3C7;--er:#B91C1C;--erbg:#FEE2E2;--in:#1D4ED8;--inbg:#DBEAFE;--r:10px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--dark);color:#cfd3da;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid var(--dark3)}
.brand b{color:#fff;letter-spacing:.14em;font-weight:800;font-size:16px;display:block}
.brand small{color:var(--amber);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.logo svg{width:34px;height:34px;display:block}
nav{padding:10px 8px;flex:1;overflow:auto}
nav a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;color:#cfd3da;font-weight:500;margin-bottom:2px;border-left:3px solid transparent}
nav a:hover{background:var(--dark2);color:#fff}
nav a.on{background:var(--dark2);color:#fff;border-left-color:var(--red)}
.nb{background:var(--red);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.me{padding:14px 16px;border-top:1px solid var(--dark3);display:flex;flex-direction:column;gap:2px}
.me b{color:#fff}.me small{color:var(--amber);margin-bottom:8px}
main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0;flex:1}
.hamb{display:none;background:none;border:0;font-size:22px;cursor:pointer;padding:0 4px}
.demo{background:var(--wnbg);color:var(--wn);font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap}
.content{padding:20px 24px 60px;max-width:1400px}
.scrim{display:none}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;z-index:30;width:250px;transform:translateX(-100%);transition:transform .2s}.nav-open .side{transform:none}.nav-open .scrim{display:block;position:fixed;inset:0;background:#0006;z-index:20}.hamb{display:block}.top{padding:12px 16px}.content{padding:16px 14px 60px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:960px){.g2,.g3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;border-top:3px solid var(--red)}
.kpi.a{border-top-color:var(--amber)}
.kpi small{color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:24px;margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
.bar select,.bar input{width:auto;min-width:150px}
.btn{border:1px solid var(--bd);background:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c2c6cd}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}.btn.p:hover{background:var(--red2)}
.btn.d{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.ghost{background:transparent;border-color:var(--dark3);color:#cfd3da}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.lg{padding:13px 18px;font-size:15px}
.btn.danger{color:var(--er);border-color:#f0c2c2}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:9px 10px;background:#fff;width:100%;min-width:0}
input:disabled{background:#F3F4F6}
input:focus,select:focus,textarea:focus{outline:2px solid #E11D2D2e;border-color:var(--red)}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut)}
.req::after{content:" *";color:var(--red)}
.fr{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:10px}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:var(--r);background:#fff}
.tw td input{min-width:90px}
table{width:100%;border-collapse:collapse}
th{background:#F8F9FA;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #F0F1F3;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.ck{cursor:pointer}tr.ck:hover td{background:#FFF6F6}
td.n,th.n{text-align:right;white-space:nowrap}
.tg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.t-pre{background:var(--inbg);color:var(--in)}.t-aberta{background:var(--wnbg);color:var(--wn)}.t-execucao{background:#EDE9FE;color:#6D28D9}.t-finalizada{background:var(--okbg);color:var(--ok)}.t-cancelada{background:#F3F4F6;color:#6B7280}
.tt{background:#F1F2F4;color:#374151}.tr{background:var(--erbg);color:var(--er)}.ta{background:var(--wnbg);color:var(--wn)}.tok{background:var(--okbg);color:var(--ok)}
.mut{color:var(--mut)}.small{font-size:12px}
.empty{padding:26px;text-align:center;color:var(--mut)}
#modal .ov{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.md{background:#fff;border-radius:12px;width:100%;max-width:720px;box-shadow:0 20px 60px #0005}
.md.w{max-width:1020px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#fff;border-radius:12px 12px 0 0;z-index:2}
.mh h2{margin:0;font-size:17px;flex:1}
.mb{padding:16px 18px}

.x{background:none;border:0;font-size:24px;cursor:pointer;color:var(--mut);line-height:1}
@media(max-width:860px){#modal .ov{padding:0}.md{border-radius:0;min-height:100vh}.mh,.mf{border-radius:0}.mf .btn{flex:1}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg button{border:1px solid var(--bd);background:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--red);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.sec .mut{text-transform:none;letter-spacing:0;font-weight:500}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px}
.kv small{display:block;color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase}
.kv b{font-weight:600}
.oscard{background:#fff;border:1px solid var(--bd);border-left:5px solid var(--amber);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer}
.oscard.execucao{border-left-color:#7C3AED}
.oscard .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.oscard .num{font-weight:800;font-size:17px}
.oscard .ln{margin-top:6px;color:#374151}
.diff-f{color:var(--er);font-weight:700}.diff-s{color:var(--wn);font-weight:700}.diff-o{color:var(--ok);font-weight:700}
.fotos{display:flex;gap:10px;flex-wrap:wrap}
.fotos img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}
.fotos .ph{position:relative}
.fotos .ph button{position:absolute;top:-7px;right:-7px;background:var(--er);color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer}
.hbar{display:flex;align-items:center;gap:8px;margin:7px 0}
.hbar .l{width:150px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{flex:1;background:#F1F2F4;border-radius:4px;height:18px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--red)}
.hbar .t i.a{background:var(--amber)}
.hbar .v{min-width:70px;text-align:right;font-weight:700;font-size:13px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--dark);padding:20px;background-image:repeating-linear-gradient(135deg,#ffffff06 0 18px,transparent 18px 36px)}
.lbox{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:410px;border-top:5px solid var(--red)}
.lbox h1{margin:12px 0 4px;font-size:22px}
.lbox .logo svg{width:46px;height:46px}
.ulist .btn{display:flex;width:100%;justify-content:space-between;margin-bottom:8px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.ts{background:var(--dark);color:#fff;padding:11px 16px;border-radius:8px;font-weight:600;box-shadow:0 6px 20px #0004;border-left:4px solid var(--amber);max-width:90vw}
.ts.err{border-left-color:var(--red)}.ts.ok{border-left-color:#22C55E}
.alert{padding:10px 12px;border-radius:8px;background:var(--wnbg);color:var(--wn);font-weight:600;margin-bottom:12px;font-size:13px}
.alert.i{background:var(--inbg);color:var(--in);font-weight:500}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.toggle input{width:18px;height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px dashed #c2c6cd;background:#fff;border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;font-weight:600}
.scanbox{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.scanbox input{max-width:200px}
.lnc{border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:10px;background:#FCFCFD}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block}@page{size:A4;margin:12mm}}
.pr{font-family:Inter,Arial,sans-serif;color:#000;font-size:12px}
.pr .phd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #E11D2D;padding-bottom:10px;margin-bottom:12px;gap:16px}
.pr h1{margin:0;font-size:20px;letter-spacing:.1em}
.pr h2{margin:4px 0 0;font-size:30px}
.pr table{margin-top:6px}
.pr td,.pr th{border:1px solid #888;padding:5px 7px;color:#000}
.pr th{background:#eee}
.pr .kvp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 14px;margin:8px 0}
.pr .kvp small{display:block;font-size:9px;text-transform:uppercase;color:#444;font-weight:700}
.pr .box{border:1px solid #888;padding:8px;margin:10px 0;min-height:70px}
.pr .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:50px}
.pr .sig div{border-top:1px solid #000;padding-top:4px;text-align:center}
.pr .sect{font-weight:800;text-transform:uppercase;font-size:11px;margin-top:12px;color:#B8141F}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="print"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =========================================================
   ZIRAN · SISTEMA DE ARMAZÉM GERAL  v1.0
   Para ligar no Firebase, preencha FIREBASE_CONFIG.
   Vazio = modo demonstração (dados só neste navegador).
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA9wkUC8XCEQ_AENjIrwiGbnWnAHvCbgpQ",
  authDomain: "logistica-690ed.firebaseapp.com",
  projectId: "logistica-690ed",
  storageBucket: "logistica-690ed.firebasestorage.app",
  messagingSenderId: "669513711462",
  appId: "1:669513711462:web:7fd78fce823ccd00d452a7"
};
const MODO_DEMO = !FIREBASE_CONFIG.apiKey;
// Único e-mail que pode virar o primeiro usuário Gestão (deve ser igual ao das regras do Firestore)
const GESTOR_INICIAL = 'gerencia@zirannordeste.com.br';

/* ---------- constantes ---------- */
const PERFIS = {gestao:'Gestão',comercial:'Comercial',logistica:'Logística',gate:'Gate',conferente:'Conferente'};
const VIEW_INICIAL = {gestao:'painel',comercial:'clientes',logistica:'programacao',gate:'gate',conferente:'conferencia'};
const MENU = [
  {id:'painel',label:'Painel',perfis:['gestao','comercial','logistica']},
  {id:'programacao',label:'Programação',perfis:['gestao','logistica']},
  {id:'gate',label:'Gate',perfis:['gestao','logistica','gate']},
  {id:'conferencia',label:'Conferência',perfis:['gestao','logistica','conferente']},
  {id:'os',label:'Ordens de Serviço',perfis:['gestao','logistica','comercial','gate']},
  {id:'estoque',label:'Estoque por NF',perfis:['gestao','logistica','comercial','gate','conferente']},
  {id:'conteineres',label:'Contêineres',perfis:['gestao','logistica','comercial','gate','conferente']},
  {id:'clientes',label:'Clientes',perfis:['gestao','comercial','logistica']},
  {id:'cadastros',label:'Equipe e Equipamentos',perfis:['gestao']},
  {id:'config',label:'Configurações',perfis:['gestao']}
];
const TIPOS = {recebimento:'Recebimento',desova:'Desova',transbordo:'Transbordo',estufagem:'Estufagem',carregamento:'Carregamento'};
const STATUS = {pre:'Programada',aberta:'Aberta',execucao:'Em execução',finalizada:'Finalizada',cancelada:'Cancelada'};
const ATIVAS = ['pre','aberta','execucao'];
const ENTRADAS = {cntr_cheio:'Contêiner cheio',cntr_vazio:'Contêiner vazio',carga_solta:'Carga solta (caminhão)'};
const FINS = {
  cntr_cheio:[['prestacking','Prestacking (sai cheio)'],['desova','Desova no armazém'],['transbordo','Transbordo p/ outro CNTR']],
  cntr_vazio:[['estufagem','Estufagem'],['guarda','Guarda (sai vazio)']],
  carga_solta:[['armazenar','Armazenagem'],['estufagem','Ova direta em CNTR'],['carregamento','Carregamento direto em carreta']]
};
const FIN_NOME = {prestacking:'Prestacking',desova:'Desova',transbordo:'Transbordo',estufagem:'Estufagem',guarda:'Guarda',armazenar:'Armazenagem',carregamento:'Carregamento direto'};
const CTIPOS = ['20DC','40DC','40HC','20RF','40RF','20OT','40OT','20FR','40FR','20TK'];
const EQ_TIPOS = ['Empilhadeira','Reach stacker','Ponte rolante','Outro'];
const COLS = ['clientes','usuarios','os','cargas','conteineres','operadores','equipamentos','config'];
const LOGO = '<svg viewBox="0 0 40 40"><rect width="40" height="40" rx="8" fill="#E11D2D"/><path d="M7 31 L21 9 h6 L13 31z" fill="#fff"/><path d="M17 31 L31 9 h3 v4 L22 31z" fill="#fff" opacity=".75"/></svg>';

/* ---------- utilitários ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now = ()=>Date.now();
const isoDe = ts=>{const d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const hojeISO = ()=>isoDe(now());
const fDH = ts=>ts?new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const fD = ts=>ts?new Date(ts).toLocaleDateString('pt-BR'):'—';
const fISO = iso=>iso?iso.split('-').reverse().join('/'):'—';
const num = v=>{if(typeof v==='number')return isFinite(v)?v:0;v=String(v??'').trim();if(!v)return 0;if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)||0};
const fN = (n,d=0)=>(num(n)).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fR = n=>num(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const sum = (a,k)=>(a||[]).reduce((s,x)=>s+num(x[k]),0);
const dias = (a,b)=>a?Math.max(0,Math.floor(((b||now())-a)/86400000)):0;
const r2 = n=>Math.round(num(n)*100)/100;
const normCntr = s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const up = s=>String(s||'').toUpperCase().trim();
const dur = ms=>{if(!ms||ms<0)return '—';const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
function toast(m,t=''){const d=document.createElement('div');d.className='ts '+t;d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3200)}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();c.close()},250)}catch(e){}}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Falha ao carregar leitor de QR'));document.head.appendChild(s)})}

/* ---------- dados ---------- */
const DB = {data:{}};
COLS.forEach(c=>DB.data[c]={});
const L = c=>Object.values(DB.data[c]||{});
const G = (c,id)=>id?(DB.data[c]||{})[id]:null;
const CFG = ()=>Object.assign({localizacao:false,diasAlerta:30},G('config','geral')||{});
const cliNome = id=>{const c=G('clientes',id);return c?(c.fantasia||c.razao):'—'};
const usrNome = id=>G('usuarios',id)?.nome||'—';
const opNome = id=>id==='manual'?'Manual (sem máquina)':(G('operadores',id)?.nome||'—');
const eqNome = id=>G('equipamentos',id)?.nome||'—';

const LS_KEY='ziran_armazem_demo_v1';
const Local = {
  init(){
    const raw=localStorage.getItem(LS_KEY);
    if(raw){try{Object.assign(DB.data,JSON.parse(raw))}catch(e){seedDemo()}}else seedDemo();
    COLS.forEach(c=>DB.data[c]=DB.data[c]||{});
    window.addEventListener('storage',e=>{if(e.key===LS_KEY&&e.newValue){try{DB.data=JSON.parse(e.newValue);onData()}catch(_){}}});
  },
  save(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB.data))}catch(e){toast('Espaço local cheio — remova fotos ou use o Firebase','err')}},
  async batch(ops){ops.forEach(([op,c,o])=>{if(op==='set')DB.data[c][o.id]=JSON.parse(JSON.stringify(o));else delete DB.data[c][o]});this.save();onData()},
  async next(name){const k=DB.data.config.contadores||{id:'contadores'};k[name]=(k[name]||0)+1;DB.data.config.contadores=k;this.save();return k[name]}
};
const FB = {
  db:null,unsubs:[],loaded:new Set(),full:false,
  init(){firebase.initializeApp(FIREBASE_CONFIG);this.db=firebase.firestore()},
  listen(cols){cols.forEach(c=>{this.unsubs.push(this.db.collection(c).onSnapshot(s=>{const m={};s.forEach(d=>m[d.id]={...d.data(),id:d.id});DB.data[c]=m;this.loaded.add(c);onData()},err=>{console.error(c,err);this.loaded.add(c);if(App.user)toast('Sem permissão para ler '+c,'err');onData()}))})},
  listenMe(uid){this.unsubs.push(this.db.collection('usuarios').doc(uid).onSnapshot(d=>{if(d.exists)DB.data.usuarios[uid]={...d.data(),id:uid};else delete DB.data.usuarios[uid];this.loaded.add('usuarios');onData()},err=>{console.error(err);this.loaded.add('usuarios');onData()}))},
  stop(){this.unsubs.forEach(u=>u());this.unsubs=[];this.loaded.clear();this.full=false;COLS.forEach(c=>DB.data[c]={})},
  async batch(ops){const b=this.db.batch();ops.forEach(([op,c,o])=>{const ref=this.db.collection(c).doc(op==='set'?o.id:o);if(op==='set'){const d=JSON.parse(JSON.stringify(o));if('atualizadoEm' in d)d.atualizadoEm=firebase.firestore.FieldValue.serverTimestamp();b.set(ref,d)}else b.delete(ref)});await b.commit()},
  async next(name){const ref=this.db.collection('config').doc('contadores');return this.db.runTransaction(async t=>{const d=await t.get(ref);const v=((d.exists&&d.data()[name])||0)+1;t.set(ref,{[name]:v},{merge:true});return v})}
};

/* ---------- regras de saldo ---------- */
function reservado(cargaId,exceto){let v=0,p=0;L('os').forEach(o=>{if(o.id===exceto||!ATIVAS.includes(o.status))return;(o.itens||[]).forEach(i=>{if(i.cargaId===cargaId){v+=num(i.volumes);p+=num(i.peso)}})});return{v,p}}
function disp(c,exceto){const r=reservado(c.id,exceto);return{v:Math.max(0,num(c.saldoVol)-r.v),p:Math.max(0,r2(num(c.saldoPeso)-r.p))}}
const valorSaldo = c=>num(c.volumes)>0?num(c.valor)*num(c.saldoVol)/num(c.volumes):(c.status==='encerrada'?0:num(c.valor));
const cntrTerminal = ()=>L('conteineres').filter(k=>k.status==='terminal');
const cntrOcupado = (kid,exceto)=>L('os').some(o=>o.id!==exceto&&ATIVAS.includes(o.status)&&o.conteinerId===kid);
const cargasNoCntr = kid=>L('cargas').filter(c=>c.conteinerId===kid&&c.status==='no_cntr');
const cargasArmazem = cli=>L('cargas').filter(c=>c.local==='armazem'&&c.status==='armazenada'&&num(c.saldoVol)>0&&(!cli||c.clienteId===cli));

function osCntr(o){
  if(o.tipo==='recebimento'||o.tipo==='estufagem')return o.cntr?.numero||'';
  const k=G('conteineres',o.conteinerId);return k?.numero||'';
}
function osResumo(o){
  const p=[];
  if(o.tipo==='recebimento'){p.push(ENTRADAS[o.entrada]||'');if(o.cntr?.numero)p.push(o.cntr.numero+' '+(o.cntr.tipo||''));if(o.nfs?.length)p.push(o.nfs.length+' NF · '+fN(sum(o.nfs,'volumes'))+' vol');}
  if(o.tipo==='desova')p.push('CNTR '+osCntr(o)+' → armazém');
  if(o.tipo==='transbordo')p.push(osCntr(o)+' → '+(o.cntr?.numero||''));
  if(o.tipo==='estufagem')p.push(fN(sum(o.itens,'volumes'))+' vol → CNTR '+(o.cntr?.numero||''));
  if(o.tipo==='carregamento')p.push(o.objeto==='conteiner'?'Saída do CNTR '+osCntr(o):fN(sum(o.itens,'volumes'))+' vol · '+(o.itens||[]).length+' NF');
  if(o.veiculo?.placa)p.push('Placa '+o.veiculo.placa);
  return p.filter(Boolean).join(' · ');
}

  if(!MODO_DEMO&&App.authUid&&!App.user){

      FB.batch([['set','usuarios',nu],['set','config',{id:'bootstrap',em:now(),por:App.authUid}]]).catch(e=>toast(e.message,'err'));
      return;
    }

  }
  if(App.user){
    const u=G('usuarios',App.user.id);
    if(u&&!u.ativo){toast('Usuário desativado','err');ACT.logout();return}

  if(!lista.length)return `<div class="empty">${vazio}</div>`;
  const hj=hojeISO();
  return `<div class="tw"><table><thead><tr><th>Nº</th><th>Data</th><th>Tipo</th><th>Cliente</th><th>Resumo</th><th>Conferente</th><th>Status</th></tr></thead><tbody>${lista.map(o=>`<tr class="ck" data-act="osVer" data-id="${o.id}"><td><b>${o.numero}</b></td><td>${fISO(o.dataPrevista)}${ATIVAS.includes(o.status)&&o.dataPrevista<hj?' <span class="tg tr">atrasada</span>':''}</td><td>${tagT(o.tipo)}</td><td>${esc(cliNome(o.clienteId))}</td><td class="small">${esc(osResumo(o))}</td><td class="small">${o.conferenteId?esc(usrNome(o.conferenteId)):'—'}</td><td>${tagS(o.status)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- PROGRAMAÇÃO ---------- */
VIEWS.programacao = ()=>{
  const os=L('os').filter(o=>ATIVAS.includes(o.status)).sort((a,b)=>a.dataPrevista.localeCompare(b.dataPrevista)||a.seq-b.seq);
  const pre=os.filter(o=>o.status==='pre'),fila=os.filter(o=>o.status!=='pre');
  return `<div class="bar">
    <button class="btn p" data-act="novaOS" data-t="recebimento">+ Recebimento</button>
    <button class="btn p" data-act="novaOS" data-t="desova">+ Desova</button>
    <button class="btn p" data-act="novaOS" data-t="transbordo">+ Transbordo</button>
    <button class="btn p" data-act="novaOS" data-t="estufagem">+ Estufagem</button>
    <button class="btn p" data-act="novaOS" data-t="carregamento">+ Carregamento</button>
  </div>
  <div class="card"><h3>Aguardando veículo no gate (pré-O.S.) <span class="tg t-pre">${pre.length}</span></h3>${osTabela(pre,'Nenhuma programação aguardando veículo.')}</div>
  <div class="card"><h3>Na fila dos conferentes <span class="tg t-aberta">${fila.length}</span></h3>${osTabela(fila,'Nenhuma O.S. na fila.')}</div>`;
};

/* ---------- GATE ---------- */
VIEWS.gate = ()=>{
  const hj=hojeISO(),os=L('os');
  const pre=os.filter(o=>o.status==='pre').sort((a,b)=>a.dataPrevista.localeCompare(b.dataPrevista)||a.seq-b.seq);
  const hoje=pre.filter(o=>o.dataPrevista<=hj),prox=pre.filter(o=>o.dataPrevista>hj);
  const lib=os.filter(o=>o.liberadoEm&&isoDe(o.liberadoEm)===hj).sort((a,b)=>b.liberadoEm-a.liberadoEm);
  const tab=(l,btn)=>l.length?`<div class="tw"><table><thead><tr><th>Nº</th><th>Data</th><th>Tipo</th><th>Cliente</th><th>Resumo</th><th></th></tr></thead><tbody>${l.map(o=>`<tr><td><b>${o.numero}</b></td><td>${fISO(o.dataPrevista)}${o.dataPrevista<hj?' <span class="tg tr">atrasada</span>':''}</td><td>${tagT(o.tipo)}</td><td>${esc(cliNome(o.clienteId))}</td><td class="small">${esc(osResumo(o))}</td><td class="n">${btn(o)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nada aqui.</div>';
  return `<div class="bar"><button class="btn p lg" data-act="novaGate">+ Entrada sem programação</button><span class="sp"></span><span class="small mut">Saída de carga ou contêiner só com programação da logística.</span></div>
  <div class="card"><h3>Programado para hoje <span class="tg t-pre">${hoje.length}</span></h3>${tab(hoje,o=>`<button class="btn p sm" data-act="liberar" data-id="${o.id}">Veículo chegou</button>`)}</div>
  <div class="card"><h3>Liberados hoje</h3>${lib.length?`<div class="tw"><table><thead><tr><th>Nº</th><th>Hora</th><th>Tipo</th><th>Cliente</th><th>Placa</th><th>Status</th><th></th></tr></thead><tbody>${lib.map(o=>`<tr class="ck" data-act="osVer" data-id="${o.id}"><td><b>${o.numero}</b></td><td>${new Date(o.liberadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td><td>${tagT(o.tipo)}</td><td>${esc(cliNome(o.clienteId))}</td><td>${esc(o.veiculo?.placa||'')}</td><td>${tagS(o.status)}</td><td class="n"><button class="btn sm" data-act="imprimir" data-id="${o.id}">Reimprimir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum veículo liberado hoje.</div>'}</div>
  <div class="card"><h3>Próximos dias</h3>${tab(prox,o=>`<button class="btn sm" data-act="osVer" data-id="${o.id}">Ver</button>`)}</div>`;
};

/* ---------- CONFERÊNCIA ---------- */
VIEWS.conferencia = ()=>{
  const me=App.user.id;
  const fila=L('os').filter(o=>o.status==='aberta'||o.status==='execucao').sort((a,b)=>{
    const pa=a.status==='execucao'&&a.conferenteId===me?0:a.status==='execucao'?1:2,pb=b.status==='execucao'&&b.conferenteId===me?0:b.status==='execucao'?1:2;
    return pa-pb||a.dataPrevista.localeCompare(b.dataPrevista)||a.seq-b.seq});
  return `<div class="scanbox"><button class="btn d lg" data-act="scan">Ler QR da O.S.</button><input id="fnum" placeholder="Nº da O.S." inputmode="numeric"><button class="btn lg" data-act="abrirNum">Abrir</button></div>
  <div class="small mut" style="margin-bottom:10px">${fila.length} O.S. na fila · atualiza sozinho</div>
  ${fila.map(o=>`<div class="oscard ${o.status}" data-act="osVer" data-id="${o.id}">
    <div class="h"><span class="num">${o.numero}</span>${tagT(o.tipo)}</div>
    <div class="ln"><b>${esc(cliNome(o.clienteId))}</b></div>
    <div class="ln small">${esc(osResumo(o))}</div>
    <div class="h" style="margin-top:8px"><span class="small mut">${fISO(o.dataPrevista)}${o.conferenteId?' · '+esc(usrNome(o.conferenteId)):''}</span>${tagS(o.status)}</div>
  </div>`).join('')||'<div class="card empty">Nenhuma O.S. na fila no momento.</div>'}`;
};

/* ---------- O.S. ---------- */
VIEWS.os = ()=>{
  const f=App.f,q=(f.oQ||'').toLowerCase().trim();
  let l=L('os');
  if(f.oT)l=l.filter(o=>o.tipo===f.oT);
  if(f.oS)l=l.filter(o=>o.status===f.oS);
  if(f.oC)l=l.filter(o=>o.clienteId===f.oC);
  if(f.oDe)l=l.filter(o=>o.dataPrevista>=f.oDe);
  if(f.oAte)l=l.filter(o=>o.dataPrevista<=f.oAte);
  if(q)l=l.filter(o=>[o.numero,osCntr(o),o.cntr?.numero,o.veiculo?.placa,o.veiculo?.motorista,cliNome(o.clienteId),...(o.nfs||[]).map(n=>n.nf),...(o.itens||[]).map(i=>i.nf),...(o.baixa?.linhas||[]).map(x=>x.nf)].join(' ').toLowerCase().includes(q));
  l.sort((a,b)=>b.seq-a.seq);
  const tot=l.length;l=l.slice(0,300);
  return `<div class="bar">
    <input id="oQ" type="search" data-f="oQ" value="${esc(f.oQ||'')}" placeholder="Buscar nº, CNTR, placa, NF…">
    <select data-f="oT"><option value="">Todos os tipos</option>${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${f.oT===k?'selected':''}>${v}</option>`).join('')}</select>
    <select data-f="oS"><option value="">Todos os status</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${f.oS===k?'selected':''}>${v}</option>`).join('')}</select>
    <select data-f="oC">${cliOpts().map(([k,v])=>`<option value="${k}" ${f.oC===k?'selected':''}>${k?esc(v):'Todos os clientes'}</option>`).join('')}</select>
    <input type="date" data-f="oDe" value="${f.oDe||''}" title="De"><input type="date" data-f="oAte" value="${f.oAte||''}" title="Até">
    ${pode('gestao','logistica')?'<span class="sp"></span><button class="btn p" data-act="novaOS" data-t="recebimento">+ Nova O.S.</button>':''}
  </div>
  <div class="small mut" style="margin-bottom:8px">${tot} O.S.${tot>300?' (mostrando 300)':''}</div>
  ${osTabela(l,'Nenhuma O.S. encontrada.')}`;
};

/* ---------- ESTOQUE ---------- */
VIEWS.estoque = ()=>{
  const cfg=CFG(),f=App.f,modo=f.eModo||'armazem',q=(f.eQ||'').toLowerCase().trim();
  let cs=L('cargas');
  if(modo==='armazem')cs=cs.filter(c=>c.local==='armazem'&&c.status==='armazenada');
  if(modo==='cntr')cs=cs.filter(c=>c.status==='no_cntr');
  if(modo==='encerradas')cs=cs.filter(c=>c.status==='encerrada');
  if(f.eC)cs=cs.filter(c=>c.clienteId===f.eC);
  if(q)cs=cs.filter(c=>[c.nf,c.mercadoria,c.emitente,c.origem,c.localizacao,cliNome(c.clienteId)].join(' ').toLowerCase().includes(q));
  cs.sort((a,b)=>a.entradaEm-b.entradaEm);
  const st=c=>c.status==='armazenada'?'<span class="tg tok">Armazém</span>':c.status==='no_cntr'?`<span class="tg ta">No CNTR ${esc(G('conteineres',c.conteinerId)?.numero||'')}</span>`:'<span class="tg t-cancelada">Encerrada</span>';
  return `<div class="seg">${[['armazem','No armazém'],['cntr','Dentro de contêiner'],['encerradas','Encerradas'],['todas','Todas']].map(([v,l])=>`<button class="${modo===v?'on':''}" data-act="setf" data-k="eModo" data-v="${v}">${l}</button>`).join('')}</div>
  <div class="bar"><input id="eQ" type="search" data-f="eQ" value="${esc(f.eQ||'')}" placeholder="Buscar NF, mercadoria, origem…">
    <select data-f="eC">${cliOpts().map(([k,v])=>`<option value="${k}" ${f.eC===k?'selected':''}>${k?esc(v):'Todos os clientes'}</option>`).join('')}</select></div>
  <div class="kpis">
    <div class="kpi a"><small>NFs</small><b>${cs.length}</b></div>
    <div class="kpi a"><small>Saldo volumes</small><b>${fN(sum(cs,'saldoVol'))}</b></div>
    <div class="kpi a"><small>Saldo peso</small><b>${fN(sum(cs,'saldoPeso')/1000,2)} t</b></div>
    <div class="kpi a"><small>Valor do saldo</small><b style="font-size:19px">${fR(cs.reduce((s,c)=>s+valorSaldo(c),0))}</b></div>
  </div>
  ${cs.length?`<div class="tw"><table><thead><tr><th>Cliente</th><th>NF</th><th>Mercadoria</th><th>Origem</th>${cfg.localizacao?'<th>Local</th>':''}<th>Entrada</th><th class="n">Dias</th><th class="n">Vol. saldo / total</th><th class="n">Peso saldo (kg)</th><th class="n">Valor saldo</th><th>Situação</th></tr></thead><tbody>${cs.map(c=>`<tr class="ck" data-act="cargaVer" data-id="${c.id}"><td>${esc(cliNome(c.clienteId))}</td><td><b>${esc(c.nf)}</b></td><td>${esc(c.mercadoria||'')}</td><td class="small">${esc(c.origem||'')}</td>${cfg.localizacao?`<td>${esc(c.localizacao||'—')}</td>`:''}<td>${fD(c.entradaEm)}</td><td class="n">${c.status==='encerrada'?dias(c.entradaEm,c.encerradaEm)+'d':diasTag(dias(c.entradaEm))}</td><td class="n"><b>${fN(c.saldoVol)}</b> / ${fN(c.volumes)}</td><td class="n">${fN(c.saldoPeso,1)}</td><td class="n">${fR(valorSaldo(c))}</td><td>${st(c)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">Nenhuma carga encontrada.</div>'}`;
};

/* ---------- CONTÊINERES ---------- */
VIEWS.conteineres = ()=>{
  const f=App.f,modo=f.kModo||'terminal',q=normCntr(f.kQ||'');
  let ks=L('conteineres');
  ks=modo==='terminal'?ks.filter(k=>k.status==='terminal'):ks.filter(k=>k.status!=='terminal');
  if(f.kC)ks=ks.filter(k=>k.clienteId===f.kC);
  if(q)ks=ks.filter(k=>k.numero.includes(q));
  ks.sort((a,b)=>modo==='terminal'?a.entradaEm-b.entradaEm:(b.saidaEm||0)-(a.saidaEm||0));
  return `<div class="seg">${[['terminal','No terminal (armazém)'],['hist','Histórico (saíram / depot)']].map(([v,l])=>`<button class="${modo===v?'on':''}" data-act="setf" data-k="kModo" data-v="${v}">${l}</button>`).join('')}</div>
  <div class="bar"><input id="kQ" type="search" data-f="kQ" value="${esc(f.kQ||'')}" placeholder="Buscar nº do contêiner">
  <select data-f="kC">${cliOpts().map(([k,v])=>`<option value="${k}" ${f.kC===k?'selected':''}>${k?esc(v):'Todos os clientes'}</option>`).join('')}</select></div>
  ${ks.length?`<div class="tw"><table><thead><tr><th>Contêiner</th><th>Tipo</th><th>Cliente</th><th>Situação</th><th>Finalidade</th><th>Lacre</th><th>Entrada</th>${modo==='terminal'?'<th class="n">Dias</th>':'<th>Saída</th><th>Destino</th>'}</tr></thead><tbody>${ks.map(k=>`<tr class="ck" data-act="cntrVer" data-id="${k.id}"><td><b>${esc(k.numero)}</b></td><td>${esc(k.tipo||'')}</td><td>${esc(cliNome(k.clienteId))}</td><td>${k.situacao==='cheio'?'<span class="tg ta">Cheio</span>':'<span class="tg tt">Vazio</span>'}</td><td>${esc(FIN_NOME[k.finalidade]||'—')}</td><td>${esc(k.lacre||'—')}</td><td>${fD(k.entradaEm)}</td>${modo==='terminal'?`<td class="n">${diasTag(dias(k.entradaEm))}</td>`:`<td>${fD(k.saidaEm)}</td><td>${k.status==='depot'?'Depot':'Saiu do terminal'}</td>`}</tr>`).join('')}</tbody></table></div>`:'<div class="card empty">Nenhum contêiner.</div>'}`;
};

/* ---------- CLIENTES ---------- */
VIEWS.clientes = ()=>{
  const q=(App.f.cQ||'').toLowerCase().trim();
  let cs=L('clientes').sort((a,b)=>(a.fantasia||a.razao).localeCompare(b.fantasia||b.razao));
  if(q)cs=cs.filter(c=>[c.razao,c.fantasia,c.cnpj,c.contato].join(' ').toLowerCase().includes(q));
  const ca=L('cargas').filter(c=>c.status==='armazenada'),kt=cntrTerminal();
  return `<div class="bar"><input id="cQ" type="search" data-f="cQ" value="${esc(App.f.cQ||'')}" placeholder="Buscar cliente, CNPJ…"><span class="sp"></span>${pode('gestao','comercial')?'<button class="btn p" data-act="cliEdit">+ Novo cliente</button>':''}</div>
  ${cs.length?`<div class="tw"><table><thead><tr><th>Cliente</th><th>CNPJ</th><th>Contato</th><th>Telefone</th><th class="n">NFs em armazém</th><th class="n">CNTR no terminal</th><th>Status</th></tr></thead><tbody>${cs.map(c=>`<tr class="ck" data-act="cliEdit" data-id="${c.id}"><td><b>${esc(c.fantasia||c.razao)}</b>${c.fantasia?`<div class="small mut">${esc(c.razao)}</div>`:''}</td><td>${esc(c.cnpj||'—')}</td><td>${esc(c.contato||'—')}</td><td>${esc(c.telefone||'—')}</td><td class="n">${ca.filter(x=>x.clienteId===c.id).length}</td><td class="n">${kt.filter(k=>k.clienteId===c.id).length}</td><td>${c.ativo!==false?'<span class="tg tok">Ativo</span>':'<span class="tg t-cancelada">Inativo</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">Nenhum cliente cadastrado.</div>'}`;
};

/* ---------- CADASTROS ---------- */
VIEWS.cadastros = ()=>{
  const us=L('usuarios').sort((a,b)=>a.nome.localeCompare(b.nome)),ops=L('operadores').sort((a,b)=>a.nome.localeCompare(b.nome)),eqs=L('equipamentos').sort((a,b)=>a.nome.localeCompare(b.nome));
  const at=x=>x.ativo!==false?'<span class="tg tok">Ativo</span>':'<span class="tg t-cancelada">Inativo</span>';
  return `<div class="card"><h3>Usuários do sistema <button class="btn p sm" data-act="usrEdit">+ Usuário</button></h3>
  <div class="tw"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th></tr></thead><tbody>${us.map(u=>`<tr class="ck" data-act="usrEdit" data-id="${u.id}"><td><b>${esc(u.nome)}</b></td><td>${esc(u.email||'—')}</td><td>${PERFIS[u.perfil]}</td><td>${at(u)}</td></tr>`).join('')}</tbody></table></div>
  <div class="small mut" style="margin-top:8px">Gestão: tudo · Comercial: clientes · Logística: programa O.S. · Gate: entradas e liberação de veículos · Conferente: baixa das O.S. pelo celular.</div></div>
  <div class="grid g2">
    <div class="card"><h3>Operadores de empilhadeira <button class="btn p sm" data-act="simpEdit" data-c="operadores">+ Operador</button></h3>
    ${ops.length?`<div class="tw"><table><tbody>${ops.map(o=>`<tr class="ck" data-act="simpEdit" data-c="operadores" data-id="${o.id}"><td><b>${esc(o.nome)}</b></td><td class="n">${at(o)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum operador.</div>'}</div>
    <div class="card"><h3>Equipamentos <button class="btn p sm" data-act="simpEdit" data-c="equipamentos">+ Equipamento</button></h3>
    ${eqs.length?`<div class="tw"><table><tbody>${eqs.map(o=>`<tr class="ck" data-act="simpEdit" data-c="equipamentos" data-id="${o.id}"><td><b>${esc(o.nome)}</b></td><td class="mut">${esc(o.tipo||'')}</td><td class="n">${at(o)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum equipamento.</div>'}</div>
  </div>`;
};

/* ---------- CONFIG ---------- */
VIEWS.config = ()=>{
  const c=CFG();
  return `<div class="card"><h3>Operação</h3>
    <label class="toggle"><input type="checkbox" id="cfgLoc" ${c.localizacao?'checked':''}> Controlar localização da carga no armazém (rua / quadra)</label>
    <div class="small mut" style="margin:6px 0 16px 28px">Quando ativo, o conferente informa a localização na desova e no recebimento de carga solta, e o estoque mostra a coluna Local.</div>
    <div class="fr" style="max-width:420px"><label class="f">Alerta de carga/contêiner parado (dias)<input type="number" id="cfgDias" min="1" value="${c.diasAlerta}"></label></div>
    <button class="btn p" data-act="cfgSave">Salvar</button></div>
  <div class="card"><h3>Dados</h3>
    <div class="bar"><button class="btn" data-act="backup">Exportar backup (JSON)</button>${MODO_DEMO?'<button class="btn danger" data-act="resetDemo">Apagar dados de demonstração</button>':''}</div>
    <div class="small mut">${MODO_DEMO?'Modo demonstração: os dados ficam só neste navegador. Para usar em produção, preencha o FIREBASE_CONFIG no código (ver README).':'Conectado ao Firebase — dados em tempo real para todos os usuários.'}</div></div>`;
};

/* =========================================================
   FORMULÁRIO NOVA O.S.
   ========================================================= */
function novaOS(tipo,modoGate){
  App.form={tipo:tipo||'recebimento',modoGate:!!modoGate,clienteId:'',dataPrevista:hojeISO(),entrada:'',finalidade:'',
    cntr:{numero:'',tipo:'40HC',lacre:'',armador:''},nfs:[],sel:{},objeto:'carga',conteinerId:'',
    veiculo:{placa:'',carreta:'',motorista:'',cpf:'',transportadora:''},obs:''};
  App.formRender=()=>setModal(formOS());
  openModal(formOS(),true);
}
function nfsEditor(){
  const f=App.form;
  return `<div class="sec">Notas fiscais (declarado)</div>
  <div class="tw"><table><thead><tr><th>Nº NF</th><th>Emitente</th><th>Mercadoria</th><th class="n">Volumes</th><th class="n">Peso (kg)</th><th class="n">Valor (R$)</th><th></th></tr></thead><tbody>
  ${f.nfs.map((n,i)=>`<tr><td>${I(`nfs.${i}.nf`)}</td><td>${I(`nfs.${i}.emitente`)}</td><td>${I(`nfs.${i}.mercadoria`)}</td><td>${I(`nfs.${i}.volumes`,'type="number" min="0" step="1"')}</td><td>${I(`nfs.${i}.peso`,'type="number" min="0" step="any"')}</td><td>${I(`nfs.${i}.valor`,'type="number" min="0" step="any"')}</td><td><button class="btn sm danger" data-act="nfDel" data-i="${i}">×</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhuma NF lançada</td></tr>'}
  </tbody></table></div><button class="btn sm" style="margin-top:8px" data-act="nfAdd">+ Adicionar NF</button>`;
}
function veiculoEditor(req){
  return `<div class="sec">Veículo ${req?'':'<span class="mut">(opcional · o gate completa na chegada)</span>'}</div>
  <div class="fr">${fld('Placa cavalo',I('veiculo.placa','style="text-transform:uppercase"'),req)}${fld('Placa carreta',I('veiculo.carreta','style="text-transform:uppercase"'))}${fld('Motorista',I('veiculo.motorista'),req)}${fld('CPF',I('veiculo.cpf','inputmode="numeric"'))}${fld('Transportadora',I('veiculo.transportadora'))}</div>`;
}
function cntrSelect(filtro,label){
  const f=App.form;
  const ks=cntrTerminal().filter(k=>filtro(k)&&(!f.clienteId||k.clienteId===f.clienteId)&&(!cntrOcupado(k.id)||k.id===f.conteinerId));
  if(!ks.length)return `<div class="alert">Nenhum contêiner disponível no terminal${f.clienteId?' para este cliente':''}.</div>`;
  return fld(label,SEL('conteinerId',[['','Selecione…'],...ks.map(k=>[k.id,`${k.numero} ${k.tipo||''} · ${k.situacao==='cheio'?'cheio':'vazio'} · ${cliNome(k.clienteId)} · ${dias(k.entradaEm)}d`])],true),1);
}
function destinoEditor(titulo){
  const f=App.form;
  const vz=cntrTerminal().filter(k=>k.situacao==='vazio'&&(!f.clienteId||k.clienteId===f.clienteId)&&!cntrOcupado(k.id));

function cargasCntrTabela(kid){
  const cs=cargasNoCntr(kid);
  return `<div class="small mut" style="margin:8px 0 4px">Carga declarada no contêiner:</div>${cs.length?`<div class="tw"><table><thead><tr><th>NF</th><th>Mercadoria</th><th class="n">Volumes</th><th class="n">Peso (kg)</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.nf)}</td><td>${esc(c.mercadoria||'')}</td><td class="n">${fN(c.volumes)}</td><td class="n">${fN(c.peso,1)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="small mut">Sem NF declarada — o conferente lança na baixa.</div>'}`;
}
const cleanVeic = v=>({placa:up(v?.placa),carreta:up(v?.carreta),motorista:String(v?.motorista||'').trim(),cpf:String(v?.cpf||'').trim(),transportadora:String(v?.transportadora||'').trim()});
const cleanNfs = a=>(a||[]).filter(n=>String(n.nf||'').trim()).map(n=>({k:n.k||uid(),nf:String(n.nf).trim(),emitente:String(n.emitente||'').trim(),mercadoria:String(n.mercadoria||'').trim(),volumes:num(n.volumes),peso:num(n.peso),valor:num(n.valor)}));
const selItens = f=>Object.entries(f.sel||{}).filter(([id,v])=>G('cargas',id)&&(num(v.volumes)>0||num(v.peso)>0)).map(([cargaId,v])=>({cargaId,nf:G('cargas',cargaId).nf,volumes:num(v.volumes),peso:num(v.peso)}));

function validaCntrEntrada(n,exceto){
  if(n.length<4)return 'Informe o nº do contêiner';
  if(cntrTerminal().some(k=>k.numero===n))return `Contêiner ${n} já está no terminal`;
  if(L('os').some(o=>o.id!==exceto&&o.tipo==='recebimento'&&ATIVAS.includes(o.status)&&o.cntr?.numero===n))return `Já existe recebimento em aberto para ${n}`;
  return '';
}
function validaDestino(f,origemId){
  const n=normCntr(f.cntr.numero);
  if(n.length<4)return 'Informe o contêiner de destino';
  const o=G('conteineres',origemId);if(o&&o.numero===n)return 'Destino igual à origem';
  const k=cntrTerminal().find(x=>x.numero===n);
  if(k&&k.clienteId!==f.clienteId)return `Contêiner ${n} está no terminal para outro cliente`;
  return '';
}
function validaItens(itens,exceto){
  if(!itens.length)return 'Informe a quantidade de ao menos uma NF';
  for(const i of itens){const c=G('cargas',i.cargaId),d=disp(c,exceto);if(i.volumes>d.v)return `NF ${c.nf}: disponível ${fN(d.v)} volumes`;if(i.volumes<=0)return `NF ${c.nf}: informe os volumes`}
  return '';
}

/* =========================================================
   BAIXA — efeitos no estoque
   ========================================================= */
function destinoCntr(o,t,ops,fin,lacre){
  const n=o.cntr.numero;let k=cntrTerminal().find(x=>x.numero===n);
  k=k?{...k}:{id:uid(),numero:n,tipo:o.cntr.tipo||'',armador:'',entradaEm:t,status:'terminal',osEntrada:o.id,origemEntrada:'Interno (depot)'};
  Object.assign(k,{situacao:'cheio',finalidade:fin,lacre,clienteId:o.clienteId});
  ops.push(['set','conteineres',k]);return k;
}
function aplicarBaixa(o,bx,t){
  const ops=[],cli=o.clienteId,placa=o.veiculo?.placa||'';
  const mov=(tipo,v,p,dest)=>({data:t,osId:o.id,osNumero:o.numero,tipo,volumes:v,peso:p,destino:dest||''});
  const setC=c=>ops.push(['set','cargas',c]),setK=k=>ops.push(['set','conteineres',k]);
  const baixaSaldo=(l,tipo,dest)=>{
    const c={...G('cargas',l.cargaId)};
    c.saldoVol=Math.max(0,num(c.saldoVol)-l.vol);c.saldoPeso=Math.max(0,r2(num(c.saldoPeso)-l.peso));
    if(c.saldoVol<=0){c.saldoVol=0;c.saldoPeso=0;c.status='encerrada';c.encerradaEm=t}
    c.movs=[...(c.movs||[]),mov(tipo,l.vol,l.peso,dest)];setC(c);return c;
  };
  if(o.tipo==='recebimento'){
    if(o.entrada==='carga_solta'){
      bx.linhas.forEach(l=>setC({id:uid(),clienteId:cli,nf:l.nf,emitente:l.emitente||'',mercadoria:l.mercadoria,valor:l.valor,volDecl:l.volDecl,pesoDecl:l.pesoDecl,volumes:l.vol,peso:l.peso,saldoVol:l.vol,saldoPeso:l.peso,avariados:l.avariados,local:'armazem',conteinerId:null,status:l.vol>0?'armazenada':'encerrada',entradaEm:t,encerradaEm:l.vol>0?null:t,origem:'Caminhão '+placa,osEntrada:o.id,localizacao:bx.localizacao||'',movs:[mov('Entrada (caminhão)',l.vol,l.peso,'Armazém')]}));
    }else{
      const k={id:uid(),numero:o.cntr.numero,tipo:o.cntr.tipo||'',armador:o.cntr.armador||'',clienteId:cli,situacao:o.entrada==='cntr_cheio'?'cheio':'vazio',status:'terminal',finalidade:o.finalidade||'',lacre:bx.lacreConferido||o.cntr.lacre||'',entradaEm:t,osEntrada:o.id,avaria:bx.avaria||'',placaEntrada:placa};
      setK(k);
      if(k.situacao==='cheio')(o.nfs||[]).forEach(n=>setC({id:uid(),clienteId:cli,nf:n.nf,emitente:n.emitente||'',mercadoria:n.mercadoria||'',valor:num(n.valor),volDecl:num(n.volumes),pesoDecl:num(n.peso),volumes:num(n.volumes),peso:num(n.peso),saldoVol:num(n.volumes),saldoPeso:num(n.peso),local:'cntr',conteinerId:k.id,status:'no_cntr',entradaEm:t,origem:'CNTR '+k.numero,osEntrada:o.id,movs:[mov('Entrada no CNTR',num(n.volumes),num(n.peso),k.numero)]}));
    }
  }
  if(o.tipo==='desova'){
    const k=G('conteineres',o.conteinerId);
    bx.linhas.forEach(l=>{
      const base=l.cargaId?{...G('cargas',l.cargaId)}:{id:uid(),clienteId:cli,nf:l.nf,emitente:'',mercadoria:l.mercadoria,valor:l.valor,volDecl:0,pesoDecl:0,origem:'CNTR '+k.numero,osEntrada:o.id,movs:[]};
      Object.assign(base,{volumes:l.vol,peso:l.peso,saldoVol:l.vol,saldoPeso:l.peso,avariados:l.avariados,local:'armazem',conteinerId:null,status:l.vol>0?'armazenada':'encerrada',entradaEm:t,encerradaEm:l.vol>0?null:t,cntrOrigem:k.numero,localizacao:bx.localizacao||''});
      base.movs=[...(base.movs||[]),mov('Desova',l.vol,l.peso,'Armazém')];setC(base);
    });
    setK({...k,situacao:'vazio',status:'depot',saidaEm:t,osSaida:o.id});
  }
  if(o.tipo==='transbordo'){
    const k=G('conteineres',o.conteinerId),d=destinoCntr(o,t,ops,'transbordo',bx.lacreNovo);
    bx.linhas.forEach(l=>{
      const base=l.cargaId?{...G('cargas',l.cargaId)}:{id:uid(),clienteId:cli,nf:l.nf,emitente:'',mercadoria:l.mercadoria,valor:l.valor,volDecl:0,pesoDecl:0,origem:'CNTR '+k.numero,osEntrada:o.id,entradaEm:t,movs:[]};
      Object.assign(base,{volumes:l.vol,peso:l.peso,saldoVol:l.vol,saldoPeso:l.peso,avariados:l.avariados,local:'cntr',conteinerId:d.id,status:l.vol>0?'no_cntr':'encerrada'});
      base.movs=[...(base.movs||[]),mov('Transbordo',l.vol,l.peso,d.numero)];setC(base);
    });
    setK({...k,situacao:'vazio',status:'depot',saidaEm:t,osSaida:o.id});
  }
  if(o.tipo==='estufagem'){
    const d=destinoCntr(o,t,ops,'estufagem',bx.lacreNovo);
    bx.linhas.forEach(l=>{
      if(l.vol<=0)return;
      const c=baixaSaldo(l,'Estufagem',d.numero),orig=G('cargas',l.cargaId);
      const vu=num(orig.volumes)?num(orig.valor)/num(orig.volumes):0;
      setC({id:uid(),clienteId:cli,nf:c.nf,emitente:c.emitente||'',mercadoria:c.mercadoria||'',valor:r2(vu*l.vol),volDecl:l.vol,pesoDecl:l.peso,volumes:l.vol,peso:l.peso,saldoVol:l.vol,saldoPeso:l.peso,local:'cntr',conteinerId:d.id,status:'no_cntr',entradaEm:t,origem:`Armazém (NF ${c.nf})`,origemCargaId:c.id,osEntrada:o.id,movs:[mov('Estufado no CNTR',l.vol,l.peso,d.numero)]});
    });
  }
  if(o.tipo==='carregamento'){
    if(o.objeto==='conteiner'){
      const k=G('conteineres',o.conteinerId);
      setK({...k,status:'saiu',saidaEm:t,osSaida:o.id,placaSaida:placa});
      cargasNoCntr(k.id).forEach(c=>setC({...c,movs:[...(c.movs||[]),mov('Saída no CNTR',num(c.saldoVol),num(c.saldoPeso),placa)],saldoVol:0,saldoPeso:0,status:'encerrada',encerradaEm:t}));
    }else bx.linhas.forEach(l=>{if(l.vol>0)baixaSaldo(l,'Carregamento',placa)});
  }
  return ops;
}

}

    ${['desova','transbordo'].includes(o.tipo)||(o.tipo==='carregamento'&&o.objeto==='conteiner')?kv(o.tipo==='transbordo'?'CNTR origem':'Contêiner',esc(`${k?.numero||'?'} ${k?.tipo||''}`))+kv('Lacre',esc(k?.lacre||'—')):''}
    ${['transbordo','estufagem'].includes(o.tipo)?kv('CNTR destino',esc(`${o.cntr?.numero||''} ${o.cntr?.tipo||''}`)):''}
    ${o.liberadoEm?kv('Liberado no gate',`${fDH(o.liberadoEm)} · ${esc(usrNome(o.liberadoPor))}`):''}
  </div>`;

    if(o.itens?.length)b+=`<div class="sec">Carga programada</div><div class="tw"><table><thead><tr><th>NF</th><th>Mercadoria</th><th class="n">Volumes</th><th class="n">Peso (kg)</th><th class="n">Saldo atual</th></tr></thead><tbody>${o.itens.map(i=>{const c=G('cargas',i.cargaId)||{};return `<tr><td><b>${esc(i.nf)}</b></td><td>${esc(c.mercadoria||'')}</td><td class="n">${fN(i.volumes)}</td><td class="n">${fN(i.peso,1)}</td><td class="n">${fN(c.saldoVol)}</td></tr>`}).join('')}</tbody></table></div>`;

  if(o.status!=='pre')a.push(`<button class="btn" data-act="imprimir" data-id="${o.id}">Imprimir</button>`);
  if(o.status==='pre'&&pode('gate','gestao','logistica'))a.push(`<button class="btn p" data-act="liberar" data-id="${o.id}">Veículo chegou · liberar</button>`);
  if(o.status==='aberta'&&pode('conferente','gestao','logistica'))a.push(`<button class="btn d" data-act="iniciar" data-id="${o.id}">Iniciar</button>`);
  if(['aberta','execucao'].includes(o.status)&&pode('conferente','gestao','logistica'))a.push(`<button class="btn p" data-act="baixa" data-id="${o.id}">Dar baixa</button>`);
  const html=shell(`${o.numero} · ${TIPOS[o.tipo]}`,b,a.join(''));
  if(App.modal)setModal(html);else openModal(html,true);
}
function printOS(id){
  const o=G('os',id);if(!o)return;
  const el=$('#print');el.innerHTML=printHTML(o);
  const q=el.querySelector('.qr');
  try{new QRCode(q,{text:o.numero,width:120,height:120,correctLevel:QRCode.CorrectLevel.M})}catch(e){q.textContent=o.numero}
  setTimeout(()=>window.print(),450);
}
function printHTML(o){
  const k=G('conteineres',o.conteinerId);
  const kv=(l,v)=>`<div><small>${l}</small>${v||'—'}</div>`;
  let linhas=[];
  if(o.tipo==='recebimento')linhas=(o.nfs||[]).map(n=>[n.nf,n.mercadoria,n.volumes,n.peso]);
  else if(['desova','transbordo'].includes(o.tipo))linhas=(o.status==='finalizada'?o.baixa.linhas.map(l=>[l.nf,l.mercadoria,l.volDecl,l.pesoDecl]):cargasNoCntr(o.conteinerId).map(c=>[c.nf,c.mercadoria,c.volumes,c.peso]));
  else linhas=(o.itens||[]).map(i=>[i.nf,G('cargas',i.cargaId)?.mercadoria||'',i.volumes,i.peso]);
  let cntr='';
  if(o.tipo==='recebimento'&&o.cntr?.numero)cntr=`${o.cntr.numero} ${o.cntr.tipo||''} · lacre ${o.cntr.lacre||'—'}`;
  if(['desova','transbordo'].includes(o.tipo)||(o.tipo==='carregamento'&&o.objeto==='conteiner'))cntr=`${k?.numero||''} ${k?.tipo||''} · lacre ${k?.lacre||'—'}`;
  if(['transbordo','estufagem'].includes(o.tipo))cntr+=(cntr?' → ':'')+`destino ${o.cntr?.numero||''}`;
  return `<div class="pr">
  <div class="phd"><div><h1>ZIRAN · ARMAZÉM GERAL</h1><div>Ordem de Serviço de <b>${TIPOS[o.tipo].toUpperCase()}</b></div><h2>${o.numero}</h2></div><div class="qr"></div></div>
  <div class="kvp">${kv('Cliente',esc(cliNome(o.clienteId)))}${kv('Data',fISO(o.dataPrevista))}${kv('Emitida',fDH(o.liberadoEm||o.criadoEm))}
  ${o.tipo==='recebimento'?kv('Entrada',ENTRADAS[o.entrada])+kv('Finalidade',finNome(o)):''}
  ${cntr?kv('Contêiner',esc(cntr)):''}
  ${o.veiculo?.placa?kv('Placa',esc(o.veiculo.placa+(o.veiculo.carreta?' / '+o.veiculo.carreta:'')))+kv('Motorista',esc(o.veiculo.motorista))+kv('CPF',esc(o.veiculo.cpf))+kv('Transportadora',esc(o.veiculo.transportadora)):''}
  </div>
  ${linhas.length?`<div class="sect">Carga</div><table style="width:100%;border-collapse:collapse"><thead><tr><th>NF</th><th>Mercadoria</th><th>Volumes</th><th>Peso (kg)</th><th>Vol. conferido</th><th>Avarias</th></tr></thead><tbody>${linhas.map(l=>`<tr><td>${esc(l[0])}</td><td>${esc(l[1]||'')}</td><td style="text-align:right">${fN(l[2])}</td><td style="text-align:right">${fN(l[3],1)}</td><td></td><td></td></tr>`).join('')}</tbody></table>`:''}
  ${o.obs?`<div class="sect">Observações</div><div>${esc(o.obs)}</div>`:''}
  <div class="sect">Ocorrências (conferente)</div><div class="box"></div>
  <div class="sig"><div>Conferente</div><div>Motorista</div></div>
  <div style="margin-top:14px;font-size:10px;color:#555">Apresente esta O.S. ao conferente. Leia o QR code ou digite ${o.numero} no sistema para dar baixa.</div>
  </div>`;
}

ACT.salvarOS=async()=>{
  const f=App.form,veic=cleanVeic(f.veiculo);let e='';
  const os={id:uid(),tipo:f.tipo,clienteId:f.clienteId,dataPrevista:f.modoGate?hojeISO():(f.dataPrevista||hojeISO()),obs:String(f.obs||'').trim(),criadoPor:App.user.id,criadoEm:now()};
  if(!f.clienteId)e='Selecione o cliente';
  else if(f.tipo==='recebimento'){
    os.entrada=f.entrada;os.finalidade=f.finalidade||'';os.veiculo=veic;
    if(!f.entrada)e='Informe o tipo de entrada';
    else{
      if(f.entrada!=='carga_solta'){const n=normCntr(f.cntr.numero);e=validaCntrEntrada(n);os.cntr={numero:n,tipo:f.cntr.tipo,lacre:String(f.cntr.lacre||'').trim(),armador:String(f.cntr.armador||'').trim()}}
      if(!e&&f.entrada!=='cntr_vazio'){
        if(f.nfs.some(n=>!String(n.nf||'').trim()&&(n.volumes||n.mercadoria||n.peso)))e='Há NF sem número';
        os.nfs=cleanNfs(f.nfs);
        if(!e&&f.entrada==='carga_solta'&&f.modoGate&&!os.nfs.length)e='Lance ao menos uma NF';
      }
      if(!e&&f.modoGate){if(!veic.placa)e='Informe a placa';else if(!veic.motorista)e='Informe o motorista'}
    }
  }else if(f.tipo==='desova'){
    os.conteinerId=f.conteinerId;if(!G('conteineres',f.conteinerId))e='Selecione o contêiner';
  }else if(f.tipo==='transbordo'){
    os.conteinerId=f.conteinerId;
    if(!G('conteineres',f.conteinerId))e='Selecione o contêiner de origem';else e=validaDestino(f,f.conteinerId);
    os.cntr={numero:normCntr(f.cntr.numero),tipo:f.cntr.tipo};
  }else if(f.tipo==='estufagem'){
    e=validaDestino(f,null);os.cntr={numero:normCntr(f.cntr.numero),tipo:f.cntr.tipo};
    if(!e){os.itens=selItens(f);e=validaItens(os.itens)}
  }else if(f.tipo==='carregamento'){
    os.objeto=f.objeto;os.veiculo=veic;
    if(f.objeto==='conteiner'){os.conteinerId=f.conteinerId;if(!G('conteineres',f.conteinerId))e='Selecione o contêiner'}
    else{os.itens=selItens(f);e=validaItens(os.itens)}
  }
  if(e)return toast(e,'err');
  const seq=await S.next('os');os.seq=seq;os.numero='OS-'+String(seq).padStart(6,'0');
  if(['recebimento','carregamento'].includes(os.tipo)){if(f.modoGate){os.status='aberta';os.liberadoPor=App.user.id;os.liberadoEm=now()}else os.status='pre'}
  else os.status='aberta';
  await S.put('os',os);closeModal();toast(`${os.numero} criada`,'ok');
  if(f.modoGate)printOS(os.id);
};

ACT.salvarLiberar=async()=>{
  const f=App.form,o=G('os',f.osId),veic=cleanVeic(f.veiculo);
  if(!o||o.status!=='pre')return toast('Esta O.S. já foi liberada','err');
  if(!veic.placa)return toast('Informe a placa','err');
  if(!veic.motorista)return toast('Informe o motorista','err');
  const up2={...o,veiculo:veic,status:'aberta',liberadoPor:App.user.id,liberadoEm:now()};
  if(o.tipo==='recebimento'){
    if(o.entrada!=='carga_solta'){const n=normCntr(f.cntr.numero),e=validaCntrEntrada(n,o.id);if(e)return toast(e,'err');up2.cntr={numero:n,tipo:f.cntr.tipo,lacre:String(f.cntr.lacre||'').trim(),armador:String(f.cntr.armador||'').trim()}}
    if(o.entrada!=='cntr_vazio'){
      if(f.nfs.some(n=>!String(n.nf||'').trim()&&(n.volumes||n.mercadoria||n.peso)))return toast('Há NF sem número','err');
      up2.nfs=cleanNfs(f.nfs);if(o.entrada==='carga_solta'&&!up2.nfs.length)return toast('Lance ao menos uma NF','err');
    }
  }
  if(o.tipo==='carregamento'&&o.objeto==='conteiner'){const k=G('conteineres',o.conteinerId);if(!k||k.status!=='terminal')return toast('Contêiner não está mais no terminal','err')}
  await S.put('os',up2);closeModal();toast(`${o.numero} liberada`,'ok');printOS(o.id);
};

ACT.baixa=d=>{

  const mk=x=>({k:uid(),vol:'',peso:'',avariados:'',...x});

  if(o.tipo==='recebimento'&&o.entrada==='carga_solta')f.linhas=(o.nfs||[]).map(n=>mk({nf:n.nf,emitente:n.emitente,mercadoria:n.mercadoria,valor:n.valor,volDecl:n.volumes,pesoDecl:n.peso}));
  if(['desova','transbordo'].includes(o.tipo))f.linhas=cargasNoCntr(o.conteinerId).map(c=>mk({cargaId:c.id,nf:c.nf,mercadoria:c.mercadoria,valor:c.valor,volDecl:c.volumes,pesoDecl:c.peso}));
  if(o.tipo==='estufagem'||(o.tipo==='carregamento'&&o.objeto!=='conteiner'))f.linhas=(o.itens||[]).map(i=>{const c=G('cargas',i.cargaId)||{};return mk({cargaId:i.cargaId,nf:c.nf||i.nf,mercadoria:c.mercadoria,volDecl:i.volumes,pesoDecl:i.peso})});

const contaFisico=o=>['desova','transbordo','estufagem'].includes(o.tipo)||(o.tipo==='recebimento'&&o.entrada==='carga_solta')||(o.tipo==='carregamento'&&o.objeto!=='conteiner');
function formBaixa(){
  const f=App.form,o=G('os',f.osId),cfg=CFG();
  const conta=contaFisico(o),podeNova=(o.tipo==='recebimento'&&o.entrada==='carga_solta')||['desova','transbordo'].includes(o.tipo);
  const ops=L('operadores').filter(x=>x.ativo!==false).map(x=>[x.id,x.nome]),eqs=L('equipamentos').filter(x=>x.ativo!==false).map(x=>[x.id,x.nome]);
  const k=G('conteineres',o.conteinerId);
  const lacreInf=o.tipo==='recebimento'?o.cntr?.lacre:k?.lacre;
  let b=`<div class="alert i"><b>${o.numero}</b> · ${TIPOS[o.tipo]} · ${esc(cliNome(o.clienteId))}<br>${esc(osResumo(o))}${o.obs?'<br>Obs.: '+esc(o.obs):''}</div>`;
  b+=`<div class="fr">${fld('Operador',SEL('operadorId',[['','Selecione…'],['manual','Manual (sem máquina)'],...ops]),1)}${fld('Equipamento',SEL('equipamentoId',[['','—'],...eqs]))}</div>`;
  if((o.tipo==='recebimento'&&o.entrada!=='carga_solta')||(o.tipo==='carregamento'&&o.objeto==='conteiner'))b+=`<div class="fr">${fld(`Lacre conferido${lacreInf?` <span class="mut">(informado: ${esc(lacreInf)})</span>`:''}`,I('lacreConferido'))}</div>`;
  if(['transbordo','estufagem'].includes(o.tipo))b+=`<div class="fr">${fld(`Novo lacre do CNTR ${esc(o.cntr?.numero||'')}`,I('lacreNovo'),1)}</div>`;
  if(conta){
    const ref=['estufagem','carregamento'].includes(o.tipo)?'programado':'declarado';
    b+=`<div class="sec">Conferência física</div><div class="bar" style="margin-bottom:10px"><button class="btn sm" data-act="preencher">Preencher igual ao ${ref}</button><span class="small mut">Conte no físico e informe o que encontrou.</span></div>`;
    b+=f.linhas.map((l,i)=>`<div class="lnc"><div class="bar" style="margin-bottom:8px">${l.nova?`<div style="flex:1;display:flex;gap:8px;flex-wrap:wrap">${I(`linhas.${i}.nf`,'placeholder="Nº da NF" style="max-width:160px"')}${I(`linhas.${i}.mercadoria`,'placeholder="Mercadoria" style="flex:1;min-width:140px"')}</div><button class="btn sm danger" data-act="linDel" data-i="${i}">Remover</button>`:`<b>NF ${esc(l.nf)}</b><span class="mut">${esc(l.mercadoria||'')}</span>`}</div>
      <div class="fr" style="margin:0;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">${fld(`Volumes <span class="mut">(${ref} ${fN(l.volDecl)})</span>`,I(`linhas.${i}.vol`,`type="number" min="0" step="1" inputmode="numeric" data-live="${i}"`),1)}${fld(`Peso kg <span class="mut">(${fN(l.pesoDecl,1)})</span>`,I(`linhas.${i}.peso`,'type="number" min="0" step="any" inputmode="decimal" placeholder="auto"'))}${fld('Avariados',I(`linhas.${i}.avariados`,'type="number" min="0" step="1" inputmode="numeric"'))}<div class="f" style="justify-content:flex-end;padding-bottom:10px" id="dif_${i}">${l.vol!==''?difTag(num(l.vol)-num(l.volDecl)):''}</div></div></div>`).join('')||'<div class="alert">Nenhuma NF declarada. Adicione as NFs encontradas.</div>';
    if(podeNova)b+=`<button class="btn sm" data-act="linAdd">+ NF não declarada</button>`;
  }
  if(cfg.localizacao&&(o.tipo==='desova'||(o.tipo==='recebimento'&&o.entrada==='carga_solta')))b+=`<div class="sec">Localização no armazém</div>${I('localizacao','placeholder="Ex.: Rua A · Quadra 3"')}`;
  b+=`<div class="sec">Ocorrências</div><div class="fr" style="grid-template-columns:1fr">${fld('Avarias / desvios',TA('avaria','placeholder="Avarias, faltas, sobras ou desvios encontrados"'))}${fld('Observações',TA('obs'))}</div>`;
  b+=`<div class="sec">Fotos <span class="mut">(até 4)</span></div><div class="fotos">${f.fotos.map((p,i)=>`<div class="ph"><img src="${p}"><button data-act="fotoDel" data-i="${i}">×</button></div>`).join('')}</div>${f.fotos.length<4?`<label class="btn sm" style="margin-top:10px">+ Foto<input type="file" accept="image/*" capture="environment" multiple data-foto hidden></label>`:''}`;
  return shell('Baixa · '+o.numero,b,`<button class="btn" data-act="close">Cancelar</button><button class="btn p" data-act="finalizar">Finalizar O.S.</button>`);
}
ACT.preencher=()=>{App.form.linhas.forEach(l=>{if(l.vol===''){l.vol=String(num(l.volDecl));if(l.peso==='')l.peso=String(num(l.pesoDecl))}});renderForm()};
ACT.linAdd=()=>{App.form.linhas.push({k:uid(),nova:true,nf:'',mercadoria:'',volDecl:0,pesoDecl:0,vol:'',peso:'',avariados:''});renderForm()};
ACT.linDel=d=>{App.form.linhas.splice(+d.i,1);renderForm()};
ACT.fotoDel=d=>{App.form.fotos.splice(+d.i,1);renderForm()};
async function addFotos(el){
  const f=App.form;if(!f)return;
  for(const file of [...el.files]){if(f.fotos.length>=4)break;try{f.fotos.push(await compress(file))}catch(e){toast('Falha ao ler a foto','err')}}
  renderForm();
}
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.55))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

ACT.finalizar=async()=>{
  const f=App.form,o=G('os',f.osId);
  if(!o||!['aberta','execucao'].includes(o.status))return toast('Esta O.S. não está mais aberta','err');
  if(!f.operadorId)return toast('Informe o operador','err');
  const conta=contaFisico(o);
  if(conta){
    if(!f.linhas.length)return toast('Informe ao menos uma NF','err');
    for(const l of f.linhas){
      if(l.nova&&!String(l.nf||'').trim())return toast('Informe o nº da NF não declarada','err');
      if(l.vol===''||l.vol==null)return toast(`Informe os volumes da NF ${l.nf}`,'err');
      if(['estufagem','carregamento'].includes(o.tipo)){const c=G('cargas',l.cargaId);if(!c||num(l.vol)>num(c.saldoVol))return toast(`NF ${l.nf}: maior que o saldo (${fN(c?.saldoVol)})`,'err')}
    }
  }
  if(['transbordo','estufagem'].includes(o.tipo)&&!String(f.lacreNovo||'').trim())return toast('Informe o novo lacre','err');
  if(['desova','transbordo'].includes(o.tipo)||(o.tipo==='carregamento'&&o.objeto==='conteiner')){const k=G('conteineres',o.conteinerId);if(!k||k.status!=='terminal')return toast('Contêiner não está no terminal','err')}
  if(o.tipo==='recebimento'&&o.cntr?.numero&&cntrTerminal().some(k=>k.numero===o.cntr.numero))return toast(`Contêiner ${o.cntr.numero} já está no terminal`,'err');
  if(!confirm(`Finalizar ${o.numero}?`))return;
  const t=now();
  const pesoDe=l=>l.peso!==''&&l.peso!=null?num(l.peso):(num(l.volDecl)?r2(num(l.pesoDecl)*num(l.vol)/num(l.volDecl)):0);
  const bx={linhas:f.linhas.map(l=>({k:l.k,cargaId:l.cargaId||null,nova:!!l.nova,nf:String(l.nf||'').trim(),emitente:l.emitente||'',mercadoria:String(l.mercadoria||'').trim(),valor:num(l.valor),volDecl:num(l.volDecl),pesoDecl:num(l.pesoDecl),vol:num(l.vol),peso:pesoDe(l),avariados:num(l.avariados)})),
    lacreConferido:String(f.lacreConferido||'').trim(),lacreNovo:String(f.lacreNovo||'').trim(),avaria:String(f.avaria||'').trim(),obs:String(f.obs||'').trim(),localizacao:String(f.localizacao||'').trim(),fotos:f.fotos};
  if(!conta)bx.linhas=[];
  const ops=aplicarBaixa(o,bx,t);
  ops.push(['set','os',{...o,status:'finalizada',conferenteId:o.conferenteId||App.user.id,finalizadoPor:App.user.id,inicioEm:o.inicioEm||f.inicioEm,fimEm:t,operadorId:f.operadorId,equipamentoId:f.equipamentoId||'',baixa:bx}]);
  await S.batch(ops);closeModal();toast(`${o.numero} finalizada`,'ok');
};

/* carga / contêiner */
ACT.cargaVer=d=>{
  const c=G('cargas',d.id);if(!c)return;const cfg=CFG();
  const kv=(l,v)=>`<div><small>${l}</small><b>${v||'—'}</b></div>`;
  let b=`<div class="kv">${kv('Cliente',esc(cliNome(c.clienteId)))}${kv('NF',esc(c.nf))}${kv('Emitente',esc(c.emitente))}${kv('Mercadoria',esc(c.mercadoria))}${kv('Origem',esc(c.origem))}${kv('Entrada',fDH(c.entradaEm))}${kv('Dias',String(dias(c.entradaEm,c.encerradaEm)))}${kv('Valor total',fR(c.valor))}
  ${kv('Volumes decl. / recebidos',`${fN(c.volDecl)} / ${fN(c.volumes)}`)}${kv('Peso decl. / recebido',`${fN(c.pesoDecl,1)} / ${fN(c.peso,1)} kg`)}${kv('Saldo',`${fN(c.saldoVol)} vol · ${fN(c.saldoPeso,1)} kg`)}${kv('Valor do saldo',fR(valorSaldo(c)))}${num(c.avariados)?kv('Avariados',fN(c.avariados)):''}</div>`;
  if(cfg.localizacao&&c.status==='armazenada')b+=`<div class="sec">Localização</div><div class="bar"><input id="locIn" value="${esc(c.localizacao||'')}" placeholder="Rua / quadra" style="max-width:280px">${pode('gestao','logistica','conferente')?`<button class="btn sm" data-act="locSave" data-id="${c.id}">Salvar</button>`:''}</div>`;
  b+=`<div class="sec">Movimentações</div>${(c.movs||[]).length?`<div class="tw"><table><thead><tr><th>Data</th><th>Movimento</th><th>O.S.</th><th class="n">Volumes</th><th class="n">Peso (kg)</th><th>Destino</th></tr></thead><tbody>${c.movs.map(m=>`<tr><td>${fDH(m.data)}</td><td>${esc(m.tipo)}</td><td><a href="#" data-act="osVer" data-id="${m.osId}">${esc(m.osNumero)}</a></td><td class="n">${fN(m.volumes)}</td><td class="n">${fN(m.peso,1)}</td><td>${esc(m.destino)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sem movimentos.</div>'}`;
  const ab=L('os').filter(o=>ATIVAS.includes(o.status)&&(o.itens||[]).some(i=>i.cargaId===c.id));
  if(ab.length)b+=`<div class="sec">Programado (reserva de saldo)</div>${osTabela(ab,'')}`;
  openModal(shell('NF '+esc(c.nf),b),true);
};
ACT.locSave=async d=>{const c=G('cargas',d.id);await S.put('cargas',{...c,localizacao:$('#locIn').value.trim()});toast('Localização salva','ok')};
ACT.cntrVer=d=>{
  const k=G('conteineres',d.id);if(!k)return;
  const kv=(l,v)=>`<div><small>${l}</small><b>${v||'—'}</b></div>`;
  const cs=L('cargas').filter(c=>c.conteinerId===k.id&&c.status==='no_cntr');
  const os=L('os').filter(o=>o.conteinerId===k.id||(o.cntr?.numero===k.numero&&o.criadoEm>=k.entradaEm-86400000)).sort((a,b)=>a.seq-b.seq);
  let b=`<div class="kv">${kv('Cliente',esc(cliNome(k.clienteId)))}${kv('Tipo',esc(k.tipo))}${kv('Armador',esc(k.armador))}${kv('Situação',k.situacao==='cheio'?'Cheio':'Vazio')}${kv('Finalidade',esc(FIN_NOME[k.finalidade]))}${kv('Lacre',esc(k.lacre))}${kv('Entrada',fDH(k.entradaEm))}${kv('Saída',k.saidaEm?fDH(k.saidaEm)+(k.status==='depot'?' (depot)':''):'')}${kv('Dias',String(dias(k.entradaEm,k.saidaEm)))}${k.avaria?kv('Avaria na entrada',esc(k.avaria)):''}</div>`;
  if(cs.length)b+=`<div class="sec">Carga dentro</div><div class="tw"><table><thead><tr><th>NF</th><th>Mercadoria</th><th class="n">Volumes</th><th class="n">Peso (kg)</th></tr></thead><tbody>${cs.map(c=>`<tr class="ck" data-act="cargaVerX" data-id="${c.id}"><td>${esc(c.nf)}</td><td>${esc(c.mercadoria||'')}</td><td class="n">${fN(c.saldoVol)}</td><td class="n">${fN(c.saldoPeso,1)}</td></tr>`).join('')}</tbody></table></div>`;
  b+=`<div class="sec">Ordens de serviço</div>${osTabela(os,'Nenhuma O.S.')}`;
  openModal(shell('Contêiner '+esc(k.numero),b),true);
};
ACT.cargaVerX=d=>{closeModal();ACT.cargaVer(d)};

  ${fld('Observações',TA('obs',dis))}

ACT.cliSave=async()=>{
  const f=App.form;if(!String(f.razao||'').trim())return toast('Informe a razão social','err');
  const cnpj=String(f.cnpj||'').replace(/\D/g,'');
  if(cnpj&&L('clientes').some(c=>c.id!==f.id&&String(c.cnpj||'').replace(/\D/g,'')===cnpj))return toast('CNPJ já cadastrado','err');
  const o={...f,id:f.id||uid(),razao:f.razao.trim(),fantasia:String(f.fantasia||'').trim(),ativo:f.ativo!==false};
  if(!f.id){o.criadoEm=now();o.criadoPor=App.user.id}
  await S.put('clientes',o);closeModal();toast('Cliente salvo','ok');
};

/* usuários / operadores / equipamentos */
ACT.usrEdit=d=>{
  const u=d.id?G('usuarios',d.id):null;
  App.form=u?{...u}:{nome:'',email:'',perfil:'conferente',ativo:true,senha:''};
  const b=`<div class="fr">${fld('Nome',I('nome'),1)}${fld('E-mail',I('email',(u&&!MODO_DEMO?'disabled ':'')+'type="email"'),!MODO_DEMO)}${fld('Perfil',SEL('perfil',Object.entries(PERFIS)))}</div>
  ${!u&&!MODO_DEMO?`<div class="fr">${fld('Senha inicial (mín. 6)',I('senha','type="text" placeholder="Para criar o login agora"'))}${fld('UID do Firebase',I('uidExistente','placeholder="Se o login já existe no Console"'))}</div><div class="small mut" style="margin-bottom:10px">Login novo: informe a senha. Login já criado em Authentication → Usuários: cole o UID do usuário (coluna "UID do usuário") e deixe a senha em branco.</div>`:''}
  <label class="toggle"><input type="checkbox" data-ff="ativo" ${App.form.ativo!==false?'checked':''}> Usuário ativo</label>
  ${u&&!MODO_DEMO&&u.email?`<div style="margin-top:12px"><button class="btn sm" data-act="usrReset" data-e="${esc(u.email)}">Enviar e-mail de redefinição de senha</button></div>`:''}`;
  openModal(shell(u?esc(u.nome):'Novo usuário',b,`<button class="btn" data-act="close">Cancelar</button><button class="btn p" data-act="usrSave">Salvar</button>`));
};
ACT.usrReset=async d=>{await firebase.auth().sendPasswordResetEmail(d.e);toast('E-mail enviado','ok')};
ACT.usrSave=async()=>{
  const f=App.form;
  if(!String(f.nome||'').trim())return toast('Informe o nome','err');
  if(f.id===App.user.id&&(f.perfil!=='gestao'||f.ativo===false))return toast('Você não pode remover seu próprio acesso de gestão','err');
  let id=f.id;
  if(!id){
    if(MODO_DEMO)id=uid();
    else{
      if(!String(f.email||'').trim())return toast('Informe o e-mail','err');
      const ux=String(f.uidExistente||'').trim();
      if(ux){
        if(!/^[A-Za-z0-9]{20,40}$/.test(ux))return toast('UID inválido — copie o UID completo do Console','err');
        if(G('usuarios',ux))return toast('Esse UID já está cadastrado','err');
        id=ux;
      }else{
        if(String(f.senha||'').length<6)return toast('Informe a senha (mín. 6) ou o UID do login existente','err');
        const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');
        try{const cr=await sec.auth().createUserWithEmailAndPassword(f.email.trim(),f.senha);id=cr.user.uid;await sec.auth().signOut()}
        catch(err){if(err.code==='auth/email-already-in-use')return toast('Esse e-mail já tem login no Firebase. Cole o UID dele (Authentication → Usuários).','err');throw err}
      }
    }
  }
  const prev=G('usuarios',id)||{criadoEm:now()};
  await S.put('usuarios',{...prev,id,nome:f.nome.trim(),email:String(f.email||'').trim(),perfil:f.perfil,ativo:f.ativo!==false});
  closeModal();toast('Usuário salvo','ok');
};
ACT.simpEdit=d=>{
  const c=d.c,x=d.id?G(c,d.id):null;
  App.form=x?{...x,col:c}:{col:c,nome:'',tipo:'Empilhadeira',ativo:true};
  const b=`<div class="fr">${fld(c==='operadores'?'Nome do operador':'Identificação',I('nome'),1)}${c==='equipamentos'?fld('Tipo',SEL('tipo',EQ_TIPOS.map(t=>[t,t]))):''}</div><label class="toggle"><input type="checkbox" data-ff="ativo" ${App.form.ativo!==false?'checked':''}> Ativo</label>`;
  openModal(shell(x?esc(x.nome):(c==='operadores'?'Novo operador':'Novo equipamento'),b,`<button class="btn" data-act="close">Cancelar</button><button class="btn p" data-act="simpSave">Salvar</button>`));
};
ACT.simpSave=async()=>{
  const f=App.form;if(!String(f.nome||'').trim())return toast('Informe o nome','err');
  const {col,...o}=f;o.id=o.id||uid();o.nome=o.nome.trim();o.ativo=o.ativo!==false;if(col==='operadores')delete o.tipo;

};

ACT.resetDemo=()=>{if(!confirm('Apagar todos os dados de demonstração?'))return;localStorage.removeItem(LS_KEY);localStorage.removeItem('ziran_armazem_user');location.reload()};

/* =========================================================
   INÍCIO
   ========================================================= */
function boot(){
  if(MODO_DEMO){
    Local.init();
    const id=localStorage.getItem('ziran_armazem_user'),u=id&&G('usuarios',id);
    if(u&&u.ativo)entrar(u);else renderLogin();
    return;
  }
  FB.init();App.authState='loading';renderLogin();
  firebase.auth().onAuthStateChanged(u=>{
    FB.stop();App.user=null;App.booting=false;App.authUid=u?u.uid:null;App.authEmail=u?u.email:'';
    if(!u){App.authState='out';renderLogin();return}
    App.authState='loading';renderLogin();FB.listenMe(u.uid);FB.listen(['config']);
  });
}
boot();
</script>
