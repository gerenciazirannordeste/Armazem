  App.form=x?{...x,col:c}:{col:c,nome:'',tipo:'Empilhadeira',ativo:true};
  const b=`<div class="fr">${fld(c==='operadores'?'Nome do operador':'Identificação',I('nome'),1)}${c==='equipamentos'?fld('Tipo',SEL('tipo',EQ_TIPOS.map(t=>[t,t]))):''}</div><label class="toggle"><input type="checkbox" data-ff="ativo" ${App.form.ativo!==false?'checked':''}> Ativo</label>`;
  openModal(shell(x?esc(x.nome):(c==='operadores'?'Novo operador':'Novo equipamento'),b,`<button class="btn" data-act="close">Cancelar</button><button class="btn p" data-act="simpSave">Salvar</button>`));
};
ACT.simpSave=async()=>{
  const f=App.form;if(!String(f.nome||'').trim())return toast('Informe o nome','err');
  const {col,...o}=f;o.id=o.id||uid();o.nome=o.nome.trim();o.ativo=o.ativo!==false;if(col==='operadores')delete o.tipo;
  await S.put(col,o);closeModal();toast('Salvo','ok');
};

/* config */
ACT.cfgSave=async()=>{await S.put('config',{...CFG(),id:'geral',localizacao:$('#cfgLoc').checked,baixaConferente:$('#cfgBxConf').checked,diasAlerta:Math.max(1,parseInt($('#cfgDias').value,10)||30)});toast('Configurações salvas','ok')};
const COLS_BACKUP=['config','clientes','clientes_det','operadores','equipamentos','usuarios','valores','conteineres','cargas','os'];
const NOME_COL={config:'Configurações',clientes:'Clientes',clientes_det:'Dados de clientes',operadores:'Operadores',equipamentos:'Equipamentos',usuarios:'Usuários',valores:'Valores das NFs',conteineres:'Contêineres',cargas:'NFs (estoque)',os:'Ordens de serviço'};
async function lerBackup(el){
  const file=el.files&&el.files[0];el.value='';if(!file)return;
  let j;try{j=JSON.parse(await file.text())}catch(e){return toast('Arquivo inválido','err')}
  const dados=j&&j.dados?j.dados:j;
  if(!dados||typeof dados!=='object'||!COLS_BACKUP.some(c=>dados[c]))return toast('Esse arquivo não é um backup do Armazém','err');
  if(j.projeto&&!MODO_DEMO&&j.projeto!==FIREBASE_CONFIG.projectId&&!confirm(`Esse backup é do projeto "${j.projeto}". Restaurar mesmo assim?`))return;
  const plano=[],linhas=[];
  COLS_BACKUP.forEach(c=>{
    const docs=Object.values(dados[c]||{}).filter(d=>d&&typeof d==='object'&&d.id);
    const falt=docs.filter(d=>!G(c,d.id));falt.forEach(d=>plano.push([c,d]));
    linhas.push([c,docs.length,falt.length]);
  });
  App.restore={plano,dados};
  const b=`<div class="alert i">Arquivo: <b>${esc(file.name)}</b>${j.exportadoEm?` · exportado em ${fDH(j.exportadoEm)}`:''}</div>
  <div class="tw"><table><thead><tr><th>Tipo de dado</th><th class="n">No backup</th><th class="n">Já existem</th><th class="n">Serão recriados</th></tr></thead><tbody>${linhas.map(([c,t,f])=>`<tr><td>${NOME_COL[c]}</td><td class="n">${fN(t)}</td><td class="n">${fN(t-f)}</td><td class="n"><b>${fN(f)}</b></td></tr>`).join('')}</tbody></table></div>
  <div class="small mut" style="margin-top:10px">Nada que já existe no sistema será alterado. As senhas ficam no Firebase Authentication e não fazem parte do backup: se algum login tiver sido perdido, use "Redefinir senha" no cadastro do usuário.</div>`;
  openModal(shell('Restaurar backup',b,`<button class="btn" data-act="close">Cancelar</button>${plano.length?`<button class="btn p" data-act="restaurar">Recriar ${fN(plano.length)} registro(s)</button>`:'<span class="mut small">Nada faltando — o banco já tem tudo do backup.</span>'}`),true);
}
ACT.restaurar=async el=>{
  const r=App.restore;if(!r)return;
  if(!confirm(`Recriar ${r.plano.length} registro(s) a partir do backup?`))return;
  const ops=r.plano.map(([c,d])=>{const o=JSON.parse(JSON.stringify(d));delete o.atualizadoEm;delete o.atualizadoPor;return ['set',c,o]});
  if(!MODO_DEMO)Object.values(r.dados.usuarios||{}).forEach(u=>{if(u&&u.cpf&&u.email&&!u.substituidoPor)ops.push(['merge','logins',{id:u.cpf,email:u.email,uid:u.id}])});
  const btn=document.querySelector('[data-act="restaurar"]');
  for(let i=0;i<ops.length;i+=400){
    if(btn)btn.textContent=`Restaurando… ${Math.min(i+400,ops.length)}/${ops.length}`;
    await S.batch(ops.slice(i,i+400));
  }
  App.restore=null;closeModal();toast('Backup restaurado','ok');
};
ACT.backup=()=>{const dados={...DB.data};delete dados.logins;const blob=new Blob([JSON.stringify({sistema:'ziran-armazem',versao:1,projeto:FIREBASE_CONFIG.projectId||'demo',exportadoEm:now(),dados},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ziran-armazem-backup-${hojeISO()}.json`;a.click()};
ACT.resetDemo=()=>{if(!confirm('Apagar todos os dados de demonstração?'))return;localStorage.removeItem(LS_KEY);localStorage.removeItem('ziran_armazem_user');location.reload()};

/* =========================================================
   INÍCIO
   ========================================================= */
function boot(){
  if(MODO_DEMO){
    Local.init();
    const id=sessionStorage.getItem('ziran_armazem_user'),u=id&&G('usuarios',id);
    if(u&&u.ativo)entrar(u);else renderLogin();
    return;
  }
  FB.init();App.authState='loading';renderLogin();
  firebase.auth().onAuthStateChanged(u=>{
    FB.stop();App.user=null;App.booting=false;App.authUid=u?u.uid:null;App.authEmail=u?u.email:'';
    if(!u){App.authState='out';renderLogin();return}
    App.authState='loading';renderLogin();FB.listenMe(u.uid);FB.listen(['config']);
  });
}
boot();
</script>
