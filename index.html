<style>
:root{--red:#E11D2D;--red2:#B8141F;--amber:#F59E0B;--dark:#14161A;--dark2:#1D2026;--dark3:#2A2E36;--bg:#F3F4F6;--card:#fff;--tx:#191B1F;--mut:#6B7280;--bd:#E2E4E8;--ok:#15803D;--okbg:#DCFCE7;--wn:#B45309;--wnbg:#FEF3C7;--er:#B91C1C;--erbg:#FEE2E2;--in:#1D4ED8;--inbg:#DBEAFE;--r:10px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:232px 1fr;grid-template-rows:56px 1fr;min-height:100vh}
.hdr{grid-column:1/-1;position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:14px;padding:0 20px;background:#1b1b1d;border-bottom:1px solid #2b2b2f;height:56px}
.hlogo{height:24px;display:block}
.htxt{color:#cfd3da;font-size:14px;white-space:nowrap}
.hdr .sp{flex:1}
.huser{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.huser b{color:#fff;font-size:13px}.huser small{color:var(--amber);font-size:11px}
.hdr .hamb{color:#fff}
.ptitle{padding:18px 24px 0}.ptitle h1{margin:0;font-size:19px}
.side{background:var(--dark);color:#cfd3da;display:flex;flex-direction:column;position:sticky;top:56px;height:calc(100vh - 56px)}
.brand{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:18px 16px;border-bottom:1px solid var(--dark3)}
.blogo{height:34px;display:block}
.brand b{color:#fff;letter-spacing:.14em;font-weight:800;font-size:16px;display:block}
.brand small{color:var(--amber);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.logo svg{width:34px;height:34px;display:block}
nav{padding:10px 8px;flex:1;overflow:auto}
nav a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;color:#cfd3da;font-weight:500;margin-bottom:2px;border-left:3px solid transparent}
nav a:hover{background:var(--dark2);color:#fff}
nav a.on{background:var(--dark2);color:#fff;border-left-color:var(--red)}
.nb{background:var(--red);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.me{padding:14px 16px;border-top:1px solid var(--dark3);display:flex;flex-direction:column;gap:2px}
.me b{color:#fff}.me small{color:var(--amber);margin-bottom:8px}
main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0;flex:1}
.hamb{display:none;background:none;border:0;font-size:22px;cursor:pointer;padding:0 4px}
.demo{background:var(--wnbg);color:var(--wn);font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap}
.content{padding:20px 24px 60px;max-width:1400px}
.scrim{display:none}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:56px;z-index:30;width:250px;height:calc(100vh - 56px);transform:translateX(-100%);transition:transform .2s}.nav-open .side{transform:none}.nav-open .scrim{display:block;position:fixed;inset:56px 0 0 0;background:#0006;z-index:20}.hamb{display:block}.hdr{padding:0 12px;gap:10px}.htxt,.huser{display:none}.ptitle{padding:14px 14px 0}.content{padding:14px 14px 60px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:960px){.g2,.g3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;border-top:3px solid var(--red)}
.kpi.a{border-top-color:var(--amber)}
.kpi small{color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:24px;margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
.bar select,.bar input{width:auto;min-width:150px}
.btn{border:1px solid var(--bd);background:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c2c6cd}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}.btn.p:hover{background:var(--red2)}
.btn.d{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.ghost{background:transparent;border-color:var(--dark3);color:#cfd3da}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.lg{padding:13px 18px;font-size:15px}
.btn.danger{color:var(--er);border-color:#f0c2c2}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:9px 10px;background:#fff;width:100%;min-width:0}
input:disabled{background:#F3F4F6}
input:focus,select:focus,textarea:focus{outline:2px solid #E11D2D2e;border-color:var(--red)}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut)}
.req::after{content:" *";color:var(--red)}
.fr{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:10px}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:var(--r);background:#fff}
.tw td input{min-width:90px}
table{width:100%;border-collapse:collapse}
th{background:#F8F9FA;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #F0F1F3;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.ck{cursor:pointer}tr.ck:hover td{background:#FFF6F6}
td.n,th.n{text-align:right;white-space:nowrap}
.tg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.t-pre{background:var(--inbg);color:var(--in)}.t-aberta{background:var(--wnbg);color:var(--wn)}.t-execucao{background:#EDE9FE;color:#6D28D9}.t-finalizada{background:var(--okbg);color:var(--ok)}.t-cancelada{background:#F3F4F6;color:#6B7280}

.mb{padding:16px 18px}

/* ---------- utilitários ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now = ()=>Date.now();
const isoDe = ts=>{const d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const hojeISO = ()=>isoDe(now());
const fDH = ts=>ts?new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const fD = ts=>ts?new Date(ts).toLocaleDateString('pt-BR'):'—';
const fISO = iso=>iso?iso.split('-').reverse().join('/'):'—';
const num = v=>{if(typeof v==='number')return isFinite(v)?v:0;v=String(v??'').trim();if(!v)return 0;if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)||0};
const fN = (n,d=0)=>(num(n)).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fR = n=>num(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const sum = (a,k)=>(a||[]).reduce((s,x)=>s+num(x[k]),0);
const dias = (a,b)=>a?Math.max(0,Math.floor(((b||now())-a)/86400000)):0;
const r2 = n=>Math.round(num(n)*100)/100;
const normCntr = s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const up = s=>String(s||'').toUpperCase().trim();
const dur = ms=>{if(!ms||ms<0)return '—';const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
function toast(m,t=''){const d=document.createElement('div');d.className='ts '+t;d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3200)}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();c.close()},250)}catch(e){}}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Falha ao carregar leitor de QR'));document.head.appendChild(s)})}

const LS_KEY='ziran_armazem_demo_v1';
const Local = {
  init(){
    const raw=localStorage.getItem(LS_KEY);
    if(raw){try{Object.assign(DB.data,JSON.parse(raw))}catch(e){seedDemo()}}else seedDemo();
    COLS.forEach(c=>DB.data[c]=DB.data[c]||{});
    window.addEventListener('storage',e=>{if(e.key===LS_KEY&&e.newValue){try{DB.data=JSON.parse(e.newValue);onData()}catch(_){}}});
  },
  save(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB.data))}catch(e){toast('Espaço local cheio — remova fotos ou use o Firebase','err')}},
  async batch(ops){ops.forEach(([op,c,o])=>{DB.data[c]=DB.data[c]||{};if(op==='set')DB.data[c][o.id]=JSON.parse(JSON.stringify(o));else if(op==='merge'){const p=DB.data[c][o.id]||{};const d=JSON.parse(JSON.stringify(o));if(d.nfs&&p.nfs)d.nfs={...p.nfs,...d.nfs};DB.data[c][o.id]={...p,...d}}else delete DB.data[c][o]});this.save();onData()},
  async next(name){const k=DB.data.config.contadores||{id:'contadores'};k[name]=(k[name]||0)+1;DB.data.config.contadores=k;this.save();return k[name]}
};
const FB = {
  db:null,unsubs:[],loaded:new Set(),full:false,
  init(){firebase.initializeApp(FIREBASE_CONFIG);this.db=firebase.firestore()},
  listen(cols){cols.forEach(c=>{this.unsubs.push(this.db.collection(c).onSnapshot(s=>{const m={};s.forEach(d=>m[d.id]={...d.data(),id:d.id});DB.data[c]=m;this.loaded.add(c);onData()},err=>{console.error(c,err);this.loaded.add(c);if(App.user)toast('Sem permissão para ler '+c,'err');onData()}))})},
  listenMe(uid){this.unsubs.push(this.db.collection('usuarios').doc(uid).onSnapshot(d=>{if(d.exists)DB.data.usuarios[uid]={...d.data(),id:uid};else delete DB.data.usuarios[uid];this.loaded.add('usuarios');onData()},err=>{console.error(err);this.loaded.add('usuarios');onData()}))},
  stop(){this.unsubs.forEach(u=>u());this.unsubs=[];this.loaded.clear();this.full=false;COLS.forEach(c=>DB.data[c]={})},
  async batch(ops){const b=this.db.batch();ops.forEach(([op,c,o])=>{const ref=this.db.collection(c).doc(op==='del'?o:o.id);if(op==='set'||op==='merge'){const d=JSON.parse(JSON.stringify(o));if('atualizadoEm' in d)d.atualizadoEm=firebase.firestore.FieldValue.serverTimestamp();op==='merge'?b.set(ref,d,{merge:true}):b.set(ref,d)}else b.delete(ref)});await b.commit()},
  async next(name){const ref=this.db.collection('config').doc('contadores');return this.db.runTransaction(async t=>{const d=await t.get(ref);const v=((d.exists&&d.data()[name])||0)+1;t.set(ref,{[name]:v},{merge:true});return v})}
};
const A = ()=>MODO_DEMO?Local:FB;
const S = {
  batch(ops){ops.forEach(o=>{if(o[0]==='set'||o[0]==='merge')Object.assign(o[2],{atualizadoEm:now(),atualizadoPor:App.user?.id||null})});return A().batch(ops)},
  put(c,o){return S.batch([['set',c,o]])},
  next(n){return A().next(n)}
};

/* ---------- regras de saldo ---------- */
function reservado(cargaId,exceto){let v=0,p=0;L('os').forEach(o=>{if(o.id===exceto||!ATIVAS.includes(o.status))return;(o.itens||[]).forEach(i=>{if(i.cargaId===cargaId){v+=num(i.volumes);p+=num(i.peso)}})});return{v,p}}
function disp(c,exceto){const r=reservado(c.id,exceto);return{v:Math.max(0,num(c.saldoVol)-r.v),p:Math.max(0,r2(num(c.saldoPeso)-r.p))}}
const valorNF = (osId,k)=>num(G('valores','os_'+osId)?.nfs?.[k]);
const valorBase = c=>c.valorRef?valorNF(c.valorRef.os,c.valorRef.k):num(c.valor);
const baseVol = c=>num(c.valorBaseVol)||num(c.volumes);
const valorTotal = c=>baseVol(c)?valorBase(c)*num(c.volumes)/baseVol(c):valorBase(c);
const valorSaldo = c=>c.status==='encerrada'?0:(baseVol(c)?valorBase(c)*num(c.saldoVol)/baseVol(c):valorBase(c));
const verValor = ()=>tem('valores');
const cntrTerminal = ()=>L('conteineres').filter(k=>k.status==='terminal');
const cntrOcupado = (kid,exceto)=>L('os').some(o=>o.id!==exceto&&ATIVAS.includes(o.status)&&o.conteinerId===kid);
const cargasNoCntr = kid=>L('cargas').filter(c=>c.conteinerId===kid&&c.status==='no_cntr');
const cargasArmazem = cli=>L('cargas').filter(c=>c.local==='armazem'&&c.status==='armazenada'&&num(c.saldoVol)>0&&(!cli||c.clienteId===cli));

/* ---------- textos de O.S. ---------- */
const tagS = s=>`<span class="tg t-${s}">${STATUS[s]||s}</span>`;
const COR_TIPO = {recebimento:'#2563EB',desova:'#7C3AED',transbordo:'#0D9488',estufagem:'#D97706',carregamento:'#E11D2D'};
const tagT = t=>`<span class="tg" style="background:${COR_TIPO[t]}1f;color:${COR_TIPO[t]}">${TIPOS[t]||t}</span>`;
function osTitulo(o){
  if(o.tipo==='recebimento')return 'RECEBIMENTO · '+({cntr_cheio:'CONTÊINER CHEIO',cntr_vazio:'CONTÊINER VAZIO',carga_solta:'CARGA SOLTA'}[o.entrada]||'');
  if(o.tipo==='desova')return 'DESOVA · CONTÊINER → ARMAZÉM';
  if(o.tipo==='transbordo')return 'TRANSBORDO · CONTÊINER → CONTÊINER';
  if(o.tipo==='estufagem')return 'ESTUFAGEM (OVA) · ARMAZÉM → CONTÊINER';
  if(o.tipo==='carregamento')return o.objeto==='conteiner'?'CARREGAMENTO · SAÍDA DE CONTÊINER':'CARREGAMENTO · SAÍDA DE CARGA';
  return TIPOS[o.tipo]||o.tipo;
}
const faixaTipo = o=>`<div class="ftipo" style="background:${COR_TIPO[o.tipo]}">${osTitulo(o)}</div>`;
const finNome = o=>FIN_NOME[o.finalidade]||'A definir';
function osCntr(o){
  if(o.tipo==='recebimento'||o.tipo==='estufagem')return o.cntr?.numero||'';
  const k=G('conteineres',o.conteinerId);return k?.numero||'';
}
function osResumo(o){
  const p=[];
  if(o.tipo==='recebimento'){p.push(ENTRADAS[o.entrada]||'');if(o.cntr?.numero)p.push(o.cntr.numero+' '+(o.cntr.tipo||''));if(o.nfs?.length)p.push(o.nfs.length+' NF · '+fN(sum(o.nfs,'volumes'))+' vol');}
  if(o.tipo==='desova')p.push('CNTR '+osCntr(o)+' → armazém');

/* ---------- movimentação no período (painel) ---------- */
const tsIni = iso=>new Date(iso+'T00:00:00').getTime();
const addD = (iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return isoDe(d.getTime())};
const segD = iso=>{const d=new Date(iso+'T12:00:00');return addD(iso,-((d.getDay()+6)%7))};
function movPeriodo(){
  const f=App.f,h=hojeISO();if(!f.mDe){f.mDe=h.slice(0,8)+'01';f.mAte=h}
  if(f.mAte<f.mDe)f.mAte=f.mDe;
  const a=tsIni(f.mDe),b=tsIni(f.mAte)+86400000,no=ts=>ts&&ts>=a&&ts<b;
  const os=L('os').filter(o=>o.status==='finalizada'&&no(o.fimEm)),ks=L('conteineres');
  const osE=id=>id?G('os',id):null;

  const recK=ks.filter(k=>no(k.entradaEm)&&(k.importado||osE(k.osEntrada)?.tipo==='recebimento'));
  const recCheio=recK.filter(k=>k.importado?!['estufagem','guarda'].includes(k.finalidade):osE(k.osEntrada)?.entrada==='cntr_cheio');
  const recVazio=recK.length-recCheio.length;
  const saiK=ks.filter(k=>k.status==='saiu'&&no(k.saidaEm)),saiCheio=saiK.filter(k=>k.situacao!=='vazio');
  const recCS=os.filter(o=>o.tipo==='recebimento'&&o.entrada==='carga_solta'),carCS=os.filter(o=>o.tipo==='carregamento'&&o.objeto!=='conteiner');
  const volBx=l=>l.reduce((s,o)=>s+sum(o.baixa?.linhas,'vol'),0),nfBx=l=>new Set(l.flatMap(o=>(o.baixa?.linhas||[]).filter(x=>num(x.vol)>0).map(x=>x.nf))).size;
  const des=os.filter(o=>o.tipo==='desova'),est=os.filter(o=>o.tipo==='estufagem'),tra=os.filter(o=>o.tipo==='transbordo');
  const imp=[...recK,...saiK].filter(k=>k.importado).length;
  const mesAnt=new Date(+h.slice(0,4),+h.slice(5,7)-2,1),ma=isoDe(mesAnt.getTime()).slice(0,8)+'01',mf=isoDe(new Date(+h.slice(0,4),+h.slice(5,7)-1,0).getTime()+43200000);
  const sg=segD(f.mDe),ehSem=f.mDe===sg&&f.mAte===addD(sg,6);
  const t=(rot,n,sub,cl)=>`<div class="kpi ${cl||''}"><small>${rot}</small><b>${fN(n)}</b>${sub?`<span class="small mut">${sub}</span>`:''}</div>`;

    <button class="btn sm" data-act="mPer" data-de="${h}" data-ate="${h}">Hoje</button><button class="btn sm" data-act="mPer" data-de="${segD(h)}" data-ate="${addD(segD(h),6)}">Esta semana</button><button class="btn sm" data-act="mPer" data-de="${isoDe(now()-6*86400000)}" data-ate="${h}">7 dias</button><button class="btn sm" data-act="mPer" data-de="${h.slice(0,8)}01" data-ate="${h}">Este mês</button><button class="btn sm" data-act="mPer" data-de="${ma}" data-ate="${mf}">Mês anterior</button></span></h3>

/* ---------- painel: entradas × saídas de CNTR por dia (últimos 30 dias) ---------- */
function mov30(){
  const N=30,h=hojeISO(),dd=[...Array(N)].map((_,i)=>addD(h,i-N+1)),ix={};dd.forEach((d,i)=>ix[d]=i);
  const E=Array(N).fill(0),S=Array(N).fill(0),osE=id=>id?G('os',id):null;
  // mesmos critérios da "Movimentação no período": entrada = recebimento no gate (ou histórico importado); saída = CNTR que saiu do terminal
  L('conteineres').forEach(k=>{
    if(k.entradaEm&&(k.importado||osE(k.osEntrada)?.tipo==='recebimento')){const i=ix[isoDe(k.entradaEm)];if(i!=null)E[i]++}
    if(k.status==='saiu'&&k.saidaEm){const i=ix[isoDe(k.saidaEm)];if(i!=null)S[i]++}
  });
  const tE=E.reduce((a,b)=>a+b,0),tS=S.reduce((a,b)=>a+b,0);
  const W=1200,H=300,pl=34,pr=8,pt=22,pb=44,cw=(W-pl-pr)/N,bw=Math.min(16,cw*.36),ch=H-pt-pb;
  const mx=Math.max(4,...E,...S),st=Math.ceil(mx/3),top=st*3,y=v=>pt+ch-v/top*ch;
  const sem=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],cE='#16A34A',cS='var(--red)';
  let g='';
  for(let v=0;v<=top;v+=st)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#E5E7EB"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#9CA3AF">${v}</text>`;
  dd.forEach((d,i)=>{
    const cx=pl+cw*i+cw/2,dw=new Date(d+'T12:00:00').getDay(),hj=d===h;
    const bar=(v,x,c,lb)=>v?`<rect x="${x}" y="${y(v)}" width="${bw}" height="${ch-(y(v)-pt)}" rx="3" fill="${c}"><title>${fISO(d)} · ${lb}: ${v}</title></rect><text x="${x+bw/2}" y="${y(v)-5}" text-anchor="middle" font-size="11" font-weight="700" fill="${c}">${v}</text>`:'';
    if(hj)g+=`<rect x="${pl+cw*i+1}" y="${pt-16}" width="${cw-2}" height="${ch+16}" rx="4" fill="#FEF3C7" opacity=".6"/>`;
    g+=bar(E[i],cx-bw-1,cE,'Entradas')+bar(S[i],cx+1,cS,'Saídas');
    g+=`<text x="${cx}" y="${H-pb+17}" text-anchor="middle" font-size="11" font-weight="${hj?700:500}" fill="${dw===0?'#9CA3AF':'#374151'}">${fISO(d).slice(0,5)}</text><text x="${cx}" y="${H-pb+31}" text-anchor="middle" font-size="10" fill="#9CA3AF">${hj?'Hoje':sem[dw]}</text>`;
  });
  return `<div class="card"><h3><span>Movimentação de contêineres · últimos 30 dias</span><span class="small mut">${fN(tE)} entradas · ${fN(tS)} saídas · saldo ${tE-tS>0?'+':''}${fN(tE-tS)}</span></h3>
  <div class="mov30"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas de contêineres por dia nos últimos 30 dias">${g}<line x1="${pl}" x2="${W-pr}" y1="${pt+ch}" y2="${pt+ch}" stroke="#D1D5DB"/></svg></div>
  <div class="mov30"><div class="lg"><span><i style="background:${cE}"></i>Entradas</span><span><i style="background:var(--red)"></i>Saídas</span><span>Entrada = recebimento no gate · Saída = CNTR que deixou o terminal (desova para o depot não conta)</span></div></div></div>`;
}
VIEWS.painel = ()=>{
  const cfg=CFG(),hj=hojeISO();
  const kt=cntrTerminal(),cheios=kt.filter(k=>k.situacao==='cheio').length;
  const ca=L('cargas').filter(c=>c.local==='armazem'&&c.status==='armazenada');
  const os=L('os');
  const abertas=os.filter(o=>o.status==='aberta'||o.status==='execucao').length;
  const prog=os.filter(o=>o.status==='pre'&&o.dataPrevista<=hj).length;
  const paradas=ca.filter(c=>dias(c.entradaEm)>=cfg.diasAlerta).length;
  const agenda=os.filter(o=>ATIVAS.includes(o.status)&&o.dataPrevista<=hj).sort((a,b)=>a.dataPrevista.localeCompare(b.dataPrevista)||a.seq-b.seq);
  const velhas=[...ca].sort((a,b)=>a.entradaEm-b.entradaEm).slice(0,8);
  const kvelhos=[...kt].sort((a,b)=>a.entradaEm-b.entradaEm).slice(0,8);
  const per=App.f.pPer||'15';
  let ini;if(per==='mes'){const d=new Date();ini=new Date(d.getFullYear(),d.getMonth(),1).getTime()}else if(per==='tudo')ini=0;else ini=now()-num(per)*86400000;
  const finT=os.filter(o=>o.status==='finalizada'&&o.fimEm>=ini);
  // O.S. geradas para o histórico importado contam por tipo, mas não na produtividade de conferente/operador
  const fin=finT.filter(o=>!o.importado);
  const chave=(key,v)=>{if(key!=='conferenteId'||!v)return v||'—';const u=G('usuarios',v);return u&&u.cpf?'cpf:'+u.cpf:v};
  const agg=(key)=>{const m={};fin.forEach(o=>{const k=key==='conferenteId'&&o.baixa?.modo==='documento'&&o.baixa.conferenteDoc?'doc:'+o.baixa.conferenteDoc:chave(key,o[key]);m[k]=m[k]||{n:0,vol:0,t:0,tn:0};m[k].n++;m[k].vol+=sum(o.baixa?.linhas,'vol');if(o.inicioEm&&o.fimEm){m[k].t+=o.fimEm-o.inicioEm;m[k].tn++}});return Object.entries(m).sort((a,b)=>b[1].n-a[1].n)};
  const conf=agg('conferenteId'),opr=agg('operadorId');
  // contêineres importados do histórico não têm O.S.: entram como recebimento (entrada) e carregamento (saída)
  const comOS=new Set(os.filter(o=>o.importado&&o.conteinerId).map(o=>o.conteinerId+'|'+o.tipo));
  const kImp=L('conteineres').filter(k=>k.importado),impE=kImp.filter(k=>!comOS.has(k.id+'|recebimento')&&k.entradaEm>=ini&&k.entradaEm<=now()).length,impS=kImp.filter(k=>!comOS.has(k.id+'|carregamento')&&k.status==='saiu'&&k.saidaEm>=ini&&k.saidaEm<=now()).length;
  const tipos=Object.keys(TIPOS).map(t=>[t,finT.filter(o=>o.tipo===t).length+(t==='recebimento'?impE:t==='carregamento'?impS:0)]);
  const mx=a=>Math.max(1,...a.map(x=>x[1].n??x[1]));
  return `
  <div class="kpis">
    <div class="kpi"><small>CNTR cheios no terminal</small><b>${cheios}</b></div>
    <div class="kpi"><small>CNTR vazios no terminal</small><b>${kt.length-cheios}</b></div>
    <div class="kpi a"><small>NFs em armazém</small><b>${ca.length}</b></div>
    <div class="kpi a"><small>Volumes em armazém</small><b>${fN(sum(ca,'saldoVol'))}</b></div>
    <div class="kpi a"><small>Peso em armazém</small><b>${fN(sum(ca,'saldoPeso')/1000,1)} t</b></div>
    ${verValor()?`<div class="kpi a"><small>Valor em armazém</small><b style="font-size:19px">${fR(ca.reduce((s,c)=>s+valorSaldo(c),0))}</b></div>`:''}
    <div class="kpi"><small>O.S. na fila</small><b>${abertas}</b></div>
    <div class="kpi"><small>Programadas p/ hoje</small><b>${prog}</b></div>
    <div class="kpi"><small>Paradas ≥ ${cfg.diasAlerta} dias</small><b style="color:${paradas?'var(--er)':'inherit'}">${paradas}</b></div>
  </div>
  ${mov30()}
  ${porCliente(kt,ca)}
  ${movPeriodo()}
  <div class="card"><h3>Agenda de hoje e pendências</h3>${osTabela(agenda,'Nada pendente para hoje.')}</div>
  <div class="grid g2">
    <div class="card"><h3>Cargas há mais tempo no armazém</h3>${velhas.length?`<div class="tw"><table><thead><tr><th>NF</th><th>Cliente</th><th class="n">Saldo vol</th><th class="n">Dias</th></tr></thead><tbody>${velhas.map(c=>`<tr class="ck" data-act="cargaVer" data-id="${c.id}"><td><b>${esc(c.nf)}</b></td><td>${esc(cliNome(c.clienteId))}</td><td class="n">${fN(c.saldoVol)}</td><td class="n">${diasTag(dias(c.entradaEm))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Armazém vazio.</div>'}</div>
    <div class="card"><h3>Contêineres há mais tempo no terminal</h3>${kvelhos.length?`<div class="tw"><table><thead><tr><th>CNTR</th><th>Cliente</th><th>Situação</th><th class="n">Dias</th></tr></thead><tbody>${kvelhos.map(k=>`<tr class="ck" data-act="cntrVer" data-id="${k.id}"><td><b>${esc(k.numero)}</b> <span class="mut small">${esc(k.tipo||'')}</span></td><td>${esc(cliNome(k.clienteId))}</td><td>${k.situacao==='cheio'?'Cheio':'Vazio'}</td><td class="n">${diasTag(dias(k.entradaEm))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum contêiner no terminal.</div>'}</div>
  </div>
  <div class="card"><h3>Produtividade <span class="seg" style="margin:0">${[['7','7 dias'],['15','15 dias'],['30','30 dias'],['mes','Mês atual'],['tudo','Desde sempre']].map(([v,l])=>`<button class="${per===v?'on':''}" data-act="setf" data-k="pPer" data-v="${v}">${l}</button>`).join('')}</span></h3>
    <div class="grid g3">
      <div><div class="sec">Conferentes · O.S. finalizadas</div>${conf.length?conf.map(([k,v])=>`<div class="hbar"><span class="l">${esc(k.startsWith('doc:')?k.slice(4):k.startsWith('cpf:')?((L('usuarios').find(u=>u.cpf===k.slice(4)&&!u.substituidoPor)||L('usuarios').find(u=>u.cpf===k.slice(4))||{}).nome||'—'):usrNome(k))}</span><span class="t"><i style="width:${v.n/mx(conf)*100}%"></i></span><span class="v">${v.n} <span class="mut small">· ${v.tn?dur(v.t/v.tn):'—'}</span></span></div>`).join(''):'<div class="empty">Sem O.S. no período.</div>'}</div>
      <div><div class="sec">Operadores · O.S. / volumes</div>${opr.length?opr.map(([k,v])=>`<div class="hbar"><span class="l">${esc(opNome(k))}</span><span class="t"><i class="a" style="width:${v.n/mx(opr)*100}%"></i></span><span class="v">${v.n} <span class="mut small">· ${fN(v.vol)} vol</span></span></div>`).join(''):'<div class="empty">Sem O.S. no período.</div>'}</div>
      <div><div class="sec">Por tipo de operação</div>${tipos.map(([t,n])=>`<div class="hbar"><span class="l">${TIPOS[t]}</span><span class="t"><i style="width:${n/mx(tipos)*100}%"></i></span><span class="v">${n}</span></div>`).join('')}${impE||impS?`<div class="small mut" style="margin-top:6px">Inclui contêineres importados do histórico ainda sem O.S.: ${impE} recebimento(s) e ${impS} carregamento(s).</div>`:''}</div>
    </div>
    <div class="small mut" style="margin-top:8px">Tempo médio = início até finalização da O.S. pelo conferente.${finT.length>fin.length?` As ${finT.length-fin.length} O.S. do histórico importado contam só em "Por tipo de operação".`:''}</div>
  </div>`;
};
const diasTag = d=>{const a=CFG().diasAlerta;return d>=a?`<span class="tg tr">${d}d</span>`:d>=a*.7?`<span class="tg ta">${d}d</span>`:`${d}d`};
function osTabela(lista,vazio,btn){
  if(!lista.length)return `<div class="empty">${vazio}</div>`;
  const hj=hojeISO();
  return `<div class="tw"><table><thead><tr><th>Nº</th><th>Data</th><th>Tipo</th><th>Cliente</th><th>Resumo</th><th>Conferente</th><th>Status</th>${btn?'<th></th>':''}</tr></thead><tbody>${lista.map(o=>`<tr class="ck" data-act="osVer" data-id="${o.id}"><td><b>${o.numero}</b></td><td>${fISO(o.dataPrevista)}${ATIVAS.includes(o.status)&&o.dataPrevista<hj?' <span class="tg tr">atrasada</span>':''}</td><td>${tagT(o.tipo)}</td><td>${esc(cliNome(o.clienteId))}</td><td class="small">${esc(osResumo(o))}</td><td class="small">${o.baixa?.modo==='documento'?esc(o.baixa.conferenteDoc)+' <span class="mut">(O.S. assinada)</span>':o.conferenteId?esc(usrNome(o.conferenteId)):'—'}</td><td>${tagS(o.status)}</td>${btn?`<td class="n">${btn(o)}</td>`:''}</tr>`).join('')}</tbody></table></div>`;
}

/* ---------- PROGRAMAÇÃO ---------- */
VIEWS.programacao = ()=>{
  const os=L('os').filter(o=>ATIVAS.includes(o.status)).sort((a,b)=>a.dataPrevista.localeCompare(b.dataPrevista)||a.seq-b.seq);
  const pre=os.filter(o=>o.status==='pre'),fila=os.filter(o=>o.status!=='pre');
  return `<div class="bar">
    <button class="btn p" data-act="novaOS" data-t="recebimento">+ Recebimento</button>
    <button class="btn p" data-act="novaOS" data-t="desova">+ Desova</button>
    <button class="btn p" data-act="novaOS" data-t="transbordo">+ Transbordo</button>
    <button class="btn p" data-act="novaOS" data-t="estufagem">+ Estufagem</button>
    <button class="btn p" data-act="novaOS" data-t="carregamento">+ Carregamento</button>
  </div>
  <div class="card"><h3>Aguardando veículo no gate (pré-O.S.) <span class="tg t-pre">${pre.length}</span></h3>${osTabela(pre,'Nenhuma programação aguardando veículo.')}</div>
  ${baixaConf()?`<div class="card"><h3>Na fila dos conferentes <span class="tg t-aberta">${fila.length}</span></h3>${osTabela(fila,'Nenhuma O.S. na fila.')}</div>`
  :`<div class="card"><h3>Aguardando O.S. assinada <span class="tg t-aberta">${fila.length}</span></h3><div class="small mut" style="margin:-4px 0 10px">Veículos liberados no gate. Quando o conferente devolver a O.S. assinada pelo motorista, confirme aqui.</div>${osTabela(fila,'Nenhuma O.S. aguardando.',o=>`<button class="btn p sm" data-act="baixa" data-id="${o.id}">Confirmar O.S. assinada</button>`)}</div>`}`;
};

/* ---------- GATE ---------- */
VIEWS.gate = ()=>{
  const hj=hojeISO(),os=L('os');
  const pre=os.filter(o=>o.status==='pre').sort((a,b)=>a.dataPrevista.localeCompare(b.dataPrevista)||a.seq-b.seq);
  const hoje=pre.filter(o=>o.dataPrevista<=hj),prox=pre.filter(o=>o.dataPrevista>hj);
  const lib=os.filter(o=>o.liberadoEm&&isoDe(o.liberadoEm)===hj).sort((a,b)=>b.liberadoEm-a.liberadoEm);
  const tab=(l,btn)=>l.length?`<div class="tw"><table><thead><tr><th>Nº</th><th>Data</th><th>Tipo</th><th>Cliente</th><th>Resumo</th><th></th></tr></thead><tbody>${l.map(o=>`<tr><td><b>${o.numero}</b></td><td>${fISO(o.dataPrevista)}${o.dataPrevista<hj?' <span class="tg tr">atrasada</span>':''}</td><td>${tagT(o.tipo)}</td><td>${esc(cliNome(o.clienteId))}</td><td class="small">${esc(osResumo(o))}</td><td class="n">${btn(o)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nada aqui.</div>';
  return `<div class="bar"><button class="btn p lg" data-act="novaGate">+ Entrada sem programação</button><span class="sp"></span><span class="small mut">Saída de carga ou contêiner só com programação da logística.</span></div>
  <div class="card"><h3>Programado para hoje <span class="tg t-pre">${hoje.length}</span></h3>${tab(hoje,o=>`<button class="btn p sm" data-act="liberar" data-id="${o.id}">Veículo chegou</button>`)}</div>
  <div class="card"><h3>Liberados hoje</h3>${lib.length?`<div class="tw"><table><thead><tr><th>Nº</th><th>Hora</th><th>Tipo</th><th>Cliente</th><th>Placa</th><th>Status</th><th></th></tr></thead><tbody>${lib.map(o=>`<tr class="ck" data-act="osVer" data-id="${o.id}"><td><b>${o.numero}</b></td><td>${new Date(o.liberadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td><td>${tagT(o.tipo)}</td><td>${esc(cliNome(o.clienteId))}</td><td>${esc(o.veiculo?.placa||'')}</td><td>${tagS(o.status)}</td><td class="n"><button class="btn sm" data-act="imprimir" data-id="${o.id}">Reimprimir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum veículo liberado hoje.</div>'}</div>
  <div class="card"><h3>Próximos dias</h3>${tab(prox,o=>`<button class="btn sm" data-act="osVer" data-id="${o.id}">Ver</button>`)}</div>`;
};

/* ---------- CONFERÊNCIA ---------- */
VIEWS.conferencia = ()=>{
  const me=App.user.id;
  const fila=L('os').filter(o=>o.status==='aberta'||o.status==='execucao').sort((a,b)=>{
    const pa=a.status==='execucao'&&a.conferenteId===me?0:a.status==='execucao'?1:2,pb=b.status==='execucao'&&b.conferenteId===me?0:b.status==='execucao'?1:2;
    return pa-pb||a.dataPrevista.localeCompare(b.dataPrevista)||a.seq-b.seq});
  if(!baixaConf())return `<div class="alert i">A baixa pelo conferente está <b>desativada</b>. Entregue a O.S. impressa ao motorista e devolva ao analista com a assinatura dele; o analista confirma no sistema.</div>
  ${fila.map(o=>`<div class="oscard ${o.status}" style="border-left-color:${COR_TIPO[o.tipo]}" data-act="osVer" data-id="${o.id}">${faixaTipo(o)}<div class="h"><span class="num">${o.numero}</span>${tagS(o.status)}</div><div class="ln"><b>${esc(cliNome(o.clienteId))}</b></div><div class="ln small">${esc(osResumo(o))}</div></div>`).join('')||'<div class="card empty">Nenhuma O.S. em aberto.</div>'}`;
  return `<div class="scanbox"><button class="btn d lg" data-act="scan">Ler QR da O.S.</button><input id="fnum" placeholder="Nº da O.S." inputmode="numeric"><button class="btn lg" data-act="abrirNum">Abrir</button></div>
  <div class="small mut" style="margin-bottom:10px">${fila.length} O.S. na fila · atualiza sozinho</div>
  ${fila.map(o=>`<div class="oscard ${o.status}" style="border-left-color:${COR_TIPO[o.tipo]}" data-act="osVer" data-id="${o.id}">
    ${faixaTipo(o)}
    <div class="h"><span class="num">${o.numero}</span>${tagS(o.status)}</div>
    <div class="ln"><b>${esc(cliNome(o.clienteId))}</b></div>
    <div class="ln small">${esc(osResumo(o))}</div>
    <div class="small mut" style="margin-top:6px">${fISO(o.dataPrevista)}${o.status==='execucao'?` · iniciada por ${esc(usrNome(o.conferenteId))} às ${new Date(o.inicioEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`:''}</div>
    <div class="acts">${o.status==='aberta'?`<button class="btn d" data-act="iniciar" data-id="${o.id}" data-src="card">Iniciar</button>`:''}<button class="btn p" data-act="baixa" data-id="${o.id}">Dar baixa</button></div>
  </div>`).join('')||'<div class="card empty">Nenhuma O.S. na fila no momento.</div>'}`;
};

/* ---------- O.S. ---------- */
VIEWS.os = ()=>{
  const f=App.f,q=(f.oQ||'').toLowerCase().trim();
  let l=L('os');
  if(f.oT)l=l.filter(o=>o.tipo===f.oT);
  if(f.oS)l=l.filter(o=>o.status===f.oS);
  if(f.oC)l=l.filter(o=>o.clienteId===f.oC);
  if(f.oDe)l=l.filter(o=>o.dataPrevista>=f.oDe);
  if(f.oAte)l=l.filter(o=>o.dataPrevista<=f.oAte);
  if(q)l=l.filter(o=>[o.numero,osCntr(o),o.cntr?.numero,o.veiculo?.placa,o.veiculo?.motorista,cliNome(o.clienteId),...(o.nfs||[]).map(n=>n.nf),...(o.itens||[]).map(i=>i.nf),...(o.baixa?.linhas||[]).map(x=>x.nf)].join(' ').toLowerCase().includes(q));
  l.sort((a,b)=>b.seq-a.seq);
  const tot=l.length;l=l.slice(0,300);
  return `<div class="bar">
    <input id="oQ" type="search" data-f="oQ" value="${esc(f.oQ||'')}" placeholder="Buscar nº, CNTR, placa, NF…">
    <select data-f="oT"><option value="">Todos os tipos</option>${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${f.oT===k?'selected':''}>${v}</option>`).join('')}</select>
    <select data-f="oS"><option value="">Todos os status</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${f.oS===k?'selected':''}>${v}</option>`).join('')}</select>
    <select data-f="oC">${cliOpts().map(([k,v])=>`<option value="${k}" ${f.oC===k?'selected':''}>${k?esc(v):'Todos os clientes'}</option>`).join('')}</select>
    <input type="date" data-f="oDe" value="${f.oDe||''}" title="De"><input type="date" data-f="oAte" value="${f.oAte||''}" title="Até">
    ${tem('programacao')?'<span class="sp"></span><button class="btn p" data-act="novaOS" data-t="recebimento">+ Nova O.S.</button>':''}
  </div>
  <div class="small mut" style="margin-bottom:8px">${tot} O.S.${tot>300?' (mostrando 300)':''}</div>
  ${osTabela(l,'Nenhuma O.S. encontrada.')}`;
};

/* ---------- ESTOQUE ---------- */
VIEWS.estoque = ()=>{
  const cfg=CFG(),f=App.f,modo=f.eModo||'armazem',q=(f.eQ||'').toLowerCase().trim();
  let cs=L('cargas');
  if(modo==='armazem')cs=cs.filter(c=>c.local==='armazem'&&c.status==='armazenada');
  if(modo==='cntr')cs=cs.filter(c=>c.status==='no_cntr');
  if(modo==='encerradas')cs=cs.filter(c=>c.status==='encerrada');
  if(f.eC)cs=cs.filter(c=>c.clienteId===f.eC);
  if(q){const qn=normCntr(q).toLowerCase();cs=cs.filter(c=>{const t=[c.nf,c.mercadoria,c.emitente,c.origem,c.localizacao,c.cntrOrigem,G('conteineres',c.conteinerId)?.numero,cliNome(c.clienteId)].join(' ').toLowerCase();return t.includes(q)||(qn.length>=4&&normCntr(t).toLowerCase().includes(qn))})}
  cs.sort((a,b)=>a.entradaEm-b.entradaEm);
  const st=c=>c.status==='armazenada'?'<span class="tg tok">Armazém</span>':c.status==='no_cntr'?`<span class="tg ta">No CNTR ${esc(G('conteineres',c.conteinerId)?.numero||'')}</span>`:'<span class="tg t-cancelada">Encerrada</span>';
  return `<div class="seg">${[['armazem','No armazém'],['cntr','Dentro de contêiner'],['encerradas','Encerradas'],['todas','Todas']].map(([v,l])=>`<button class="${modo===v?'on':''}" data-act="setf" data-k="eModo" data-v="${v}">${l}</button>`).join('')}</div>
  <div class="bar"><input id="eQ" type="search" data-f="eQ" value="${esc(f.eQ||'')}" placeholder="Buscar NF, mercadoria, contêiner…">
    <select data-f="eC">${cliOpts().map(([k,v])=>`<option value="${k}" ${f.eC===k?'selected':''}>${k?esc(v):'Todos os clientes'}</option>`).join('')}</select></div>
  <div class="kpis">
    <div class="kpi a"><small>NFs</small><b>${cs.length}</b></div>
    <div class="kpi a"><small>Saldo volumes</small><b>${fN(sum(cs,'saldoVol'))}</b></div>
    <div class="kpi a"><small>Saldo peso</small><b>${fN(sum(cs,'saldoPeso')/1000,2)} t</b></div>
    ${verValor()?`<div class="kpi a"><small>Valor do saldo</small><b style="font-size:19px">${fR(cs.reduce((s,c)=>s+valorSaldo(c),0))}</b></div>`:''}
  </div>

/* ---------- RELATÓRIOS ---------- */
const RTIT={entradas:'Entradas',saidas:'Saídas'},ROBJ={cntr:'Contêineres',carga:'Carga solta (NF)'};
const naVisita=(k,ts)=>!!ts&&ts>=num(k.entradaEm)-60000&&ts<=(k.saidaEm||now())+60000;
const volOS=o=>o.status==='finalizada'?sum(o.baixa?.linhas,'vol'):(sum(o.itens,'volumes')||sum(o.nfs,'volumes'));
// O.S. de desova, ova (estufagem) e transbordo ligadas a esta passagem do contêiner pelo terminal
function opsCntr(k,osAll){
  const r={desova:[],ova:[],trOut:[],trIn:[]};
  osAll.forEach(o=>{
    if(o.status==='cancelada')return;
    const fin=o.status==='finalizada';
    if(!fin&&k.status!=='terminal')return;
    const proprio=o.conteinerId===k.id,dest=!proprio&&!!o.cntr?.numero&&o.cntr.numero===k.numero&&(fin?naVisita(k,o.fimEm):true);
    if(o.tipo==='desova'&&proprio)r.desova.push(o);
    if(o.tipo==='estufagem'&&(proprio||dest))r.ova.push(o);
    if(o.tipo==='transbordo'&&proprio)r.trOut.push(o);
    if(o.tipo==='transbordo'&&dest)r.trIn.push(o);
  });
  Object.values(r).forEach(a=>a.sort((x,y)=>(x.fimEm||x.criadoEm||0)-(y.fimEm||y.criadoEm||0)));
  return r;
}
const opTxt=o=>o.status==='finalizada'?`${fDH(o.fimEm)} · ${o.numero}${volOS(o)?' · '+fN(volOS(o))+' vol':''}`:`${STATUS[o.status]} p/ ${fISO(o.dataPrevista)} · ${o.numero}`;
const opLista=(l,pre)=>l.map(o=>({o,t:(pre?pre(o)+' · ':'')+opTxt(o)}));
const opHTML=l=>l.length?l.map(x=>`<div style="white-space:nowrap"><a href="#" data-act="osVer" data-id="${x.o.id}"${x.o.status==='finalizada'?'':' class="mut"'}>${esc(x.t)}</a></div>`).join(''):'<span class="mut">—</span>';
const opCSV=l=>l.map(x=>x.t).join(' | ');
function entradaInfo(k){
  const o=G('os',k.osEntrada),hist=k.importado?' (histórico)':'';
  if(o?.tipo==='recebimento')return{orig:'Gate'+hist,cheio:o.entrada==='cntr_cheio',placa:k.placaEntrada||o.veiculo?.placa||'',gate:true};
  if(o?.tipo==='estufagem')return{orig:'Interno (depot) p/ ova',cheio:false,placa:'',gate:false};
  if(o?.tipo==='transbordo')return{orig:'Interno (depot) p/ transbordo',cheio:false,placa:'',gate:false};
  if(k.importado)return{orig:'Gate (histórico)',cheio:!['estufagem','guarda'].includes(k.finalidade),placa:k.placaEntrada||'',gate:true};
  return{orig:k.origemEntrada||'—',cheio:k.situacao==='cheio',placa:k.placaEntrada||'',gate:false};
}
function saidaInfo(k){
  if(!k.saidaEm)return null;
  const o=G('os',k.osSaida);
  if(k.status==='depot')return{tipo:o?.tipo==='transbordo'?'Depot (após transbordo)':'Depot (após desova)',terminal:false,cheio:false,placa:''};
  return{tipo:'Carregamento (saiu do terminal)',terminal:true,cheio:k.situacao!=='vazio',placa:k.placaSaida||o?.veiculo?.placa||''};
}
const sitAtual=k=>k.status==='terminal'?'No terminal':k.status==='depot'?'Depot':'Saiu';
const sitHTML=k=>k.status==='terminal'?'<span class="tg tok">No terminal</span>':k.status==='depot'?'<span class="tg tt">Depot</span>':'<span class="tg ta">Saiu</span>';
const cheioHTML=c=>c?'<span class="tg ta">Cheio</span>':'<span class="tg tt">Vazio</span>';
const rKpi=(rot,v,sub,cl)=>`<div class="kpi ${cl||''}"><small>${rot}</small><b>${v}</b>${sub?`<span class="small mut">${sub}</span>`:''}</div>`;
const media=(l,fn)=>l.length?l.reduce((s,x)=>s+fn(x),0)/l.length:0;

function relCntr(tipo,f,a,b){
  const osAll=L('os'),q=(f.rQ||'').toLowerCase().trim(),qn=normCntr(q);

  L('cargas').forEach(c=>(c.movs||[]).forEach(m=>{if(m.tipo==='Saída no CNTR'){const s=sMap[m.osId]||(sMap[m.osId]={nfs:[],vol:0,peso:0});s.nfs.push(c.nf);s.vol+=num(m.volumes);s.peso+=num(m.peso)}}));
  let rs=L('conteineres').filter(k=>{const ts=tipo==='entradas'?k.entradaEm:k.saidaEm;return ts&&ts>=a&&ts<b&&(!f.rC||k.clienteId===f.rC)})
    .map(k=>{const oe=G('os',k.osEntrada),ops=opsCntr(k,osAll);return{k,e:entradaInfo(k),s:saidaInfo(k),nfE:oe?.tipo==='recebimento'?(oe.nfs||[]):[],sc:sMap[k.osSaida]||null,
      des:opLista(ops.desova),ova:opLista(ops.ova),tr:[...opLista(ops.trIn,o=>'De '+(G('conteineres',o.conteinerId)?.numero||'?')),...opLista(ops.trOut,o=>'Para '+(o.cntr?.numero||'?'))]}});
  if(tipo==='entradas'&&f.rSit)rs=rs.filter(r=>f.rSit==='terminal'?r.k.status==='terminal':r.k.status!=='terminal');

  if(q)rs=rs.filter(r=>{const t=[r.k.numero,r.e.placa,r.s?.placa,r.k.lacre,cliNome(r.k.clienteId),...r.nfE.map(n=>n.nf),...(r.sc?.nfs||[])].join(' ').toLowerCase();return t.includes(q)||(qn.length>=4&&normCntr(t).includes(qn))});
  rs.sort((x,y)=>tipo==='entradas'?x.k.entradaEm-y.k.entradaEm:x.k.saidaEm-y.k.saidaEm);

  const C=[

    ['Desova',r=>opCSV(r.des),r=>opHTML(r.des)],

    ['Transbordo',r=>opCSV(r.tr),r=>opHTML(r.tr)],
    ['Situação atual',r=>sitAtual(r.k),r=>sitHTML(r.k)],
    ['Saída',r=>r.k.saidaEm?fDH(r.k.saidaEm):''],
    ['Tipo de saída',r=>r.s?.tipo||''],
    ['Placa saída',r=>r.s?.placa||''],
    ['Permanência (dias)',perm,r=>r.k.status==='terminal'?diasTag(perm(r)):perm(r)+'d','n']);
  else C.push(
    ['Saída',r=>fDH(r.k.saidaEm)],
    ['Tipo de saída',r=>r.s?.tipo||''],
    ['Placa saída',r=>r.s?.placa||''],
    ['Saiu',r=>r.s?.cheio?'Cheio':'Vazio',r=>cheioHTML(r.s?.cheio)],
    ['Lacre',r=>r.k.lacre||''],
    ['Carga na saída',r=>r.sc?`${r.sc.nfs.length} NF · ${fN(r.sc.vol)} vol`:'',r=>r.sc?`<span title="${esc(r.sc.nfs.join(', '))}">${r.sc.nfs.length} NF · ${fN(r.sc.vol)} vol</span>`:'<span class="mut">—</span>'],
    ['Desova',r=>opCSV(r.des),r=>opHTML(r.des)],
    ['Ova (estufagem)',r=>opCSV(r.ova),r=>opHTML(r.ova)],
    ['Transbordo',r=>opCSV(r.tr),r=>opHTML(r.tr)],
    ['Permanência (dias)',perm,r=>perm(r)+'d','n']);
  const ch=rs.filter(r=>tipo==='entradas'?r.e.cheio:r.s?.cheio).length,ncli=new Set(rs.map(r=>r.k.clienteId)).size;
  let K;
  if(tipo==='entradas'){
    const gate=rs.filter(r=>r.e.gate).length,ter=rs.filter(r=>r.k.status==='terminal').length;

    ['Vol. saída',r=>num(r.m.volumes),r=>fN(r.m.volumes),'n'],['Peso saída (kg)',r=>num(r.m.peso),r=>fN(r.m.peso,1),'n'],['Placa saída',r=>r.m.destino||''],

    ['Origem da carga',r=>r.c.origem||''],['Entrada no armazém',r=>fDH(r.c.entradaEm)],
    ['Saldo restante (vol)',r=>num(r.c.saldoVol),r=>fN(r.c.saldoVol),'n'],['Permanência (dias)',perm,r=>perm(r)+'d','n']];
  K=rKpi('Saídas (carregamentos)',fN(new Set(rs.map(r=>r.m.osId)).size),`${fN(rs.length)} linha(s) de NF`)+rKpi('NFs',fN(new Set(rs.map(r=>r.c.id)).size),'','a')
    +rKpi('Volumes',fN(sum(rs.map(r=>r.m),'volumes')),'','a')+rKpi('Peso',fN(sum(rs.map(r=>r.m),'peso')/1000,2)+' t','','a')+rKpi('Permanência média',fN(media(rs,perm),1)+' d');
  return{C,rs,K,act:'cargaVer',id:r=>r.c.id};
}

function veiculoEditor(req){

  <div class="fr">${fld('Placa cavalo',I('veiculo.placa','style="text-transform:uppercase"'),req)}${fld('Placa carreta',I('veiculo.carreta','style="text-transform:uppercase"'))}${fld('Motorista',I('veiculo.motorista'),req)}${fld('CPF',I('veiculo.cpf','inputmode="numeric"'))}${fld('Transportadora',I('veiculo.transportadora'))}</div>`;

function cntrSelect(filtro,label){
  const f=App.form;
  const ks=cntrTerminal().filter(k=>filtro(k)&&(!f.clienteId||k.clienteId===f.clienteId)&&(!cntrOcupado(k.id)||k.id===f.conteinerId));
  if(!ks.length)return `<div class="alert">Nenhum contêiner disponível no terminal${f.clienteId?' para este cliente':''}.</div>`;
  return fld(label,SEL('conteinerId',[['','Selecione…'],...ks.map(k=>[k.id,`${k.numero} ${k.tipo||''} · ${k.situacao==='cheio'?'cheio':'vazio'} · ${cliNome(k.clienteId)} · ${dias(k.entradaEm)}d`])],true),1);
}
function destinoEditor(titulo){
  const f=App.form;
  const alvo=new Set(L('os').filter(o=>ATIVAS.includes(o.status)&&['estufagem','transbordo'].includes(o.tipo)).map(o=>o.cntr?.numero));
  const vz=cntrTerminal().filter(k=>k.situacao==='vazio'&&(!f.clienteId||k.clienteId===f.clienteId)&&!cntrOcupado(k.id)&&!alvo.has(k.numero)).map(k=>({numero:k.numero,tipo:k.tipo,chegando:false}));
  return `<div class="sec">${titulo}</div><div class="fr">${fld('Nº do contêiner destino',I('cntr.numero','placeholder="ABCD1234567" style="text-transform:uppercase"'),1)}${fld('Tipo',SEL('cntr.tipo',CTIPOS.map(x=>[x,x])))}</div>
  ${vz.length?`<div class="small" style="font-weight:600">Contêineres vazios no terminal${f.clienteId?' deste cliente':''} — clique para escolher:</div><div class="chips">${vz.map(k=>`<button class="chip" data-act="pickDest" data-n="${esc(k.numero)}" data-t="${esc(k.tipo||'')}">${esc(k.numero)} ${esc(k.tipo||'')}</button>`).join('')}</div>`:`<div class="small mut">${f.clienteId?'Nenhum contêiner vazio deste cliente no terminal (só aparece depois da baixa do recebimento). ':''}Se o contêiner vier do depot, digite o número.</div>`}`;
}
function itensEditor(){
  const f=App.form;
  if(!f.clienteId)return '<div class="alert i">Selecione o cliente para ver o saldo em armazém.</div>';
  const cs=cargasArmazem(f.clienteId).sort((a,b)=>a.entradaEm-b.entradaEm);
  if(!cs.length)return '<div class="alert">Este cliente não tem carga com saldo no armazém.</div>';
  return `<div class="sec">Carga do armazém</div><div class="tw"><table><thead><tr><th>NF</th><th>Mercadoria</th><th>Origem</th><th class="n">Dias</th><th class="n">Disp. vol</th><th class="n">Disp. kg</th><th class="n">Volumes</th><th class="n">Peso (kg)</th></tr></thead><tbody>${cs.map(c=>{const d=disp(c);return `<tr><td><b>${esc(c.nf)}</b></td><td>${esc(c.mercadoria||'')}</td><td class="small mut">${esc(c.origem||'')}</td><td class="n">${dias(c.entradaEm)}</td><td class="n">${fN(d.v)}</td><td class="n">${fN(d.p,1)}</td><td style="width:110px">${I(`sel.${c.id}.volumes`,`type="number" min="0" max="${d.v}" step="1" data-auto="${c.id}"`)}</td><td style="width:120px">${I(`sel.${c.id}.peso`,`type="number" min="0" step="any" id="pz_${c.id}"`)}</td></tr>`}).join('')}</tbody></table></div><div class="small mut" style="margin-top:6px">Disponível = saldo menos o que já está programado em outras O.S. O peso é sugerido proporcionalmente.</div>`;
}
function formOS(){
  const f=App.form;
  if(f.conteinerId&&!f.clienteId){const k=G('conteineres',f.conteinerId);if(k)f.clienteId=k.clienteId}
  let b='';
  if(!f.modoGate)b+=`<div class="seg">${Object.keys(TIPOS).map(t=>`<button data-act="ftipo" data-t="${t}" class="${f.tipo===t?'on':''}">${TIPOS[t]}</button>`).join('')}</div>`;
  b+=`<div class="fr">${fld('Cliente',SEL('clienteId',cliOpts(),true),1)}${fld(f.modoGate?'Data':'Data prevista',`<input type="date" data-ff="dataPrevista" value="${f.dataPrevista}" ${f.modoGate?'disabled':''}>`,1)}</div>`;
  if(!L('clientes').length)b+='<div class="alert">Nenhum cliente cadastrado. O cadastro é feito pelo comercial.</div>';
  if(f.tipo==='recebimento'){
    b+=`<div class="sec">Entrada</div><div class="fr">${fld('Tipo de entrada',SEL('entrada',[['','Selecione…'],...Object.entries(ENTRADAS)],true),1)}${f.entrada?fld('Finalidade',SEL('finalidade',[['','A definir'],...FINS[f.entrada]])):''}</div>`;
    if(f.entrada==='cntr_cheio'||f.entrada==='cntr_vazio')b+=`<div class="sec">Contêiner</div><div class="fr">${fld('Nº do contêiner',I('cntr.numero','placeholder="ABCD1234567" style="text-transform:uppercase"'),1)}${fld('Tipo',SEL('cntr.tipo',CTIPOS.map(x=>[x,x])))}${fld('Lacre',I('cntr.lacre'))}${fld('Armador',I('cntr.armador'))}</div>`;
    if(f.entrada==='cntr_cheio'||f.entrada==='carga_solta')b+=nfsEditor();
    b+=veiculoEditor(f.modoGate);
  }
  if(f.tipo==='desova'){
    b+=`<div class="sec">Contêiner a desovar</div>${cntrSelect(k=>k.situacao==='cheio','Contêiner cheio no terminal')}`;
    if(f.conteinerId)b+=cargasCntrTabela(f.conteinerId);
  }
  if(f.tipo==='transbordo'){
    b+=`<div class="sec">Contêiner de origem</div>${cntrSelect(k=>k.situacao==='cheio','Contêiner cheio no terminal')}`;
    if(f.conteinerId)b+=cargasCntrTabela(f.conteinerId);
    b+=destinoEditor('Contêiner de destino');
  }
  if(f.tipo==='estufagem'){b+=destinoEditor('Contêiner a estufar');b+=itensEditor()}
  if(f.tipo==='carregamento'){
    b+=`<div class="sec">O que vai sair</div><div class="seg">${[['carga','Carga do armazém (caminhão/carreta)'],['conteiner','Contêiner (cheio ou vazio)']].map(([v,l])=>`<button data-act="fobj" data-v="${v}" class="${f.objeto===v?'on':''}">${l}</button>`).join('')}</div>`;
    b+=f.objeto==='conteiner'?cntrSelect(()=>true,'Contêiner no terminal'):itensEditor();
    b+=veiculoEditor(false);
  }
  b+=`<div class="sec">Observações</div>${TA('obs')}`;
  const pre=['recebimento','carregamento'].includes(f.tipo);
  const lbl=f.modoGate?'Registrar entrada e imprimir':pre?'Programar (pré-O.S.)':'Criar O.S. e enviar à conferência';
  return shell(f.modoGate?'Entrada sem programação':'Nova O.S.',b,`<button class="btn" data-act="close">Cancelar</button><button class="btn p" data-act="salvarOS">${lbl}</button>`);
}
function cargasCntrTabela(kid){
  const cs=cargasNoCntr(kid);
  return `<div class="small mut" style="margin:8px 0 4px">Carga declarada no contêiner:</div>${cs.length?`<div class="tw"><table><thead><tr><th>NF</th><th>Mercadoria</th><th class="n">Volumes</th><th class="n">Peso (kg)</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${esc(c.nf)}</td><td>${esc(c.mercadoria||'')}</td><td class="n">${fN(c.volumes)}</td><td class="n">${fN(c.peso,1)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="small mut">Sem NF declarada — o conferente lança na baixa.</div>'}`;
}
const cleanVeic = v=>({placa:up(v?.placa),carreta:up(v?.carreta),motorista:String(v?.motorista||'').trim(),cpf:String(v?.cpf||'').trim(),transportadora:String(v?.transportadora||'').trim()});
// Tira o valor das NFs da O.S. e devolve o documento protegido de valores
function separarValores(os){if(!os.nfs)return null;const v={};os.nfs.forEach(n=>{if(num(n.valor)>0)v[n.k]=num(n.valor);delete n.valor});return Object.keys(v).length?{id:'os_'+os.id,osId:os.id,clienteId:os.clienteId,nfs:v}:null}
const cleanNfs = a=>(a||[]).filter(n=>String(n.nf||'').trim()).map(n=>({k:n.k||uid(),nf:String(n.nf).trim(),emitente:String(n.emitente||'').trim(),mercadoria:String(n.mercadoria||'').trim(),volumes:num(n.volumes),peso:num(n.peso),valor:num(n.valor)}));
const selItens = f=>Object.entries(f.sel||{}).filter(([id,v])=>G('cargas',id)&&(num(v.volumes)>0||num(v.peso)>0)).map(([cargaId,v])=>({cargaId,nf:G('cargas',cargaId).nf,volumes:num(v.volumes),peso:num(v.peso)}));

function validaCntrEntrada(n,exceto){
  if(n.length<4)return 'Informe o nº do contêiner';
  if(cntrTerminal().some(k=>k.numero===n))return `Contêiner ${n} já está no terminal`;
  if(L('os').some(o=>o.id!==exceto&&o.tipo==='recebimento'&&ATIVAS.includes(o.status)&&o.cntr?.numero===n))return `Já existe recebimento em aberto para ${n}`;
  return '';
}
function validaDestino(f,origemId){
  const n=normCntr(f.cntr.numero);
  if(n.length<4)return 'Informe o contêiner de destino';
  const o=G('conteineres',origemId);if(o&&o.numero===n)return 'Destino igual à origem';
  const k=cntrTerminal().find(x=>x.numero===n);
  if(k&&k.clienteId!==f.clienteId)return `Contêiner ${n} está no terminal para outro cliente`;
  return '';
}
function validaItens(itens,exceto){
  if(!itens.length)return 'Informe a quantidade de ao menos uma NF';
  for(const i of itens){const c=G('cargas',i.cargaId),d=disp(c,exceto);if(i.volumes>d.v)return `NF ${c.nf}: disponível ${fN(d.v)} volumes`;if(i.volumes<=0)return `NF ${c.nf}: informe os volumes`}
  return '';
}

/* =========================================================
   BAIXA — efeitos no estoque
   ========================================================= */
function destinoCntr(o,t,ops,fin,lacre){
  const n=o.cntr.numero;let k=cntrTerminal().find(x=>x.numero===n);
  k=k?{...k}:{id:uid(),numero:n,tipo:o.cntr.tipo||'',armador:'',entradaEm:t,status:'terminal',osEntrada:o.id,origemEntrada:'Interno (depot)'};
  Object.assign(k,{situacao:'cheio',finalidade:fin,lacre,clienteId:o.clienteId});
  ops.push(['set','conteineres',k]);return k;
}
function aplicarBaixa(o,bx,t){
  const ops=[],cli=o.clienteId,placa=o.veiculo?.placa||'';
  const mov=(tipo,v,p,dest)=>({data:t,osId:o.id,osNumero:o.numero,tipo,volumes:v,peso:p,destino:dest||''});
  const setC=c=>ops.push(['set','cargas',c]),setK=k=>ops.push(['set','conteineres',k]);
  const baixaSaldo=(l,tipo,dest)=>{
    const c={...G('cargas',l.cargaId)};
    c.saldoVol=Math.max(0,num(c.saldoVol)-l.vol);c.saldoPeso=Math.max(0,r2(num(c.saldoPeso)-l.peso));
    if(c.saldoVol<=0){c.saldoVol=0;c.saldoPeso=0;c.status='encerrada';c.encerradaEm=t}
    c.movs=[...(c.movs||[]),mov(tipo,l.vol,l.peso,dest)];setC(c);return c;
  };
  if(o.tipo==='recebimento'){
    if(o.entrada==='carga_solta'){
      bx.linhas.forEach(l=>setC({id:uid(),clienteId:cli,nf:l.nf,emitente:l.emitente||'',mercadoria:l.mercadoria,valorRef:l.nfK?{os:o.id,k:l.nfK}:null,volDecl:l.volDecl,pesoDecl:l.pesoDecl,volumes:l.vol,peso:l.peso,saldoVol:l.vol,saldoPeso:l.peso,avariados:l.avariados,local:'armazem',conteinerId:null,status:l.vol>0?'armazenada':'encerrada',entradaEm:t,encerradaEm:l.vol>0?null:t,origem:'Caminhão '+placa,osEntrada:o.id,localizacao:bx.localizacao||'',movs:[mov('Entrada (caminhão)',l.vol,l.peso,'Armazém')]}));
    }else{
      const k={id:uid(),numero:o.cntr.numero,tipo:o.cntr.tipo||'',armador:o.cntr.armador||'',clienteId:cli,situacao:o.entrada==='cntr_cheio'?'cheio':'vazio',status:'terminal',finalidade:o.finalidade||'',lacre:bx.lacreConferido||o.cntr.lacre||'',entradaEm:t,osEntrada:o.id,avaria:bx.avaria||'',placaEntrada:placa};
      setK(k);
      if(k.situacao==='cheio')(o.nfs||[]).forEach(n=>setC({id:uid(),clienteId:cli,nf:n.nf,emitente:n.emitente||'',mercadoria:n.mercadoria||'',valorRef:{os:o.id,k:n.k},volDecl:num(n.volumes),pesoDecl:num(n.peso),volumes:num(n.volumes),peso:num(n.peso),saldoVol:num(n.volumes),saldoPeso:num(n.peso),local:'cntr',conteinerId:k.id,status:'no_cntr',entradaEm:t,origem:'CNTR '+k.numero,osEntrada:o.id,movs:[mov('Entrada no CNTR',num(n.volumes),num(n.peso),k.numero)]}));
    }
  }
  if(o.tipo==='desova'){
    const k=G('conteineres',o.conteinerId);
    bx.linhas.forEach(l=>{
      const base=l.cargaId?{...G('cargas',l.cargaId)}:{id:uid(),clienteId:cli,nf:l.nf,emitente:'',mercadoria:l.mercadoria,valorRef:null,volDecl:0,pesoDecl:0,origem:'CNTR '+k.numero,osEntrada:o.id,movs:[]};
      Object.assign(base,{volumes:l.vol,peso:l.peso,saldoVol:l.vol,saldoPeso:l.peso,avariados:l.avariados,local:'armazem',conteinerId:null,status:l.vol>0?'armazenada':'encerrada',entradaEm:t,encerradaEm:l.vol>0?null:t,cntrOrigem:k.numero,localizacao:bx.localizacao||''});
      base.movs=[...(base.movs||[]),mov('Desova',l.vol,l.peso,'Armazém')];setC(base);
    });
    setK({...k,situacao:'vazio',status:'depot',saidaEm:t,osSaida:o.id});
  }
  if(o.tipo==='transbordo'){
    const k=G('conteineres',o.conteinerId),d=destinoCntr(o,t,ops,'transbordo',bx.lacreNovo);
    bx.linhas.forEach(l=>{
      const base=l.cargaId?{...G('cargas',l.cargaId)}:{id:uid(),clienteId:cli,nf:l.nf,emitente:'',mercadoria:l.mercadoria,valorRef:null,volDecl:0,pesoDecl:0,origem:'CNTR '+k.numero,osEntrada:o.id,entradaEm:t,movs:[]};
      Object.assign(base,{volumes:l.vol,peso:l.peso,saldoVol:l.vol,saldoPeso:l.peso,avariados:l.avariados,local:'cntr',conteinerId:d.id,status:l.vol>0?'no_cntr':'encerrada'});
      base.movs=[...(base.movs||[]),mov('Transbordo',l.vol,l.peso,d.numero)];setC(base);
    });
    setK({...k,situacao:'vazio',status:'depot',saidaEm:t,osSaida:o.id});
  }
  if(o.tipo==='estufagem'){
    const d=destinoCntr(o,t,ops,'estufagem',bx.lacreNovo);
    bx.linhas.forEach(l=>{
      if(l.vol<=0)return;
      const c=baixaSaldo(l,'Estufagem',d.numero),orig=G('cargas',l.cargaId);
      setC({id:uid(),clienteId:cli,nf:c.nf,emitente:c.emitente||'',mercadoria:c.mercadoria||'',valorRef:orig.valorRef||null,valorBaseVol:baseVol(orig),volDecl:l.vol,pesoDecl:l.peso,volumes:l.vol,peso:l.peso,saldoVol:l.vol,saldoPeso:l.peso,local:'cntr',conteinerId:d.id,status:'no_cntr',entradaEm:t,origem:`Armazém (NF ${c.nf})`,origemCargaId:c.id,osEntrada:o.id,movs:[mov('Estufado no CNTR',l.vol,l.peso,d.numero)]});
    });
  }
  if(o.tipo==='carregamento'){
    if(o.objeto==='conteiner'){
      const k=G('conteineres',o.conteinerId);
      setK({...k,status:'saiu',saidaEm:t,osSaida:o.id,placaSaida:placa});
      cargasNoCntr(k.id).forEach(c=>setC({...c,movs:[...(c.movs||[]),mov('Saída no CNTR',num(c.saldoVol),num(c.saldoPeso),placa)],saldoVol:0,saldoPeso:0,status:'encerrada',encerradaEm:t}));
    }else bx.linhas.forEach(l=>{if(l.vol>0)baixaSaldo(l,'Carregamento',placa)});
  }
  return ops;
}

function linhasHTML(ls){
  return `<div class="tw"><table><thead><tr><th>NF</th><th>Mercadoria</th><th class="n">Vol. decl.</th><th class="n">Vol. contado</th><th class="n">Diferença</th><th class="n">Peso decl.</th><th class="n">Peso contado</th><th class="n">Avariados</th></tr></thead><tbody>${ls.map(l=>`<tr><td><b>${esc(l.nf)}</b>${l.nova?' <span class="tg tr">não declarada</span>':''}</td><td>${esc(l.mercadoria||'')}</td><td class="n">${fN(l.volDecl)}</td><td class="n">${fN(l.vol)}</td><td class="n">${difTag(num(l.vol)-num(l.volDecl))}</td><td class="n">${fN(l.pesoDecl,1)}</td><td class="n">${fN(l.peso,1)}</td><td class="n">${num(l.avariados)?`<span class="diff-f">${fN(l.avariados)}</span>`:'—'}</td></tr>`).join('')}</tbody></table></div>`;
}
function osDetalhe(id){
  const o=G('os',id);if(!o)return toast('O.S. não encontrada','err');
  App.form=null;App.formRender=null;
  const k=G('conteineres',o.conteinerId);
  const kv=(l,v)=>v?`<div><small>${l}</small><b>${v}</b></div>`:'';
  let b=`<div class="mdtipo">${faixaTipo(o)}</div><div class="bar">${tagS(o.status)}<span class="sp"></span><span class="small mut">Criada por ${esc(usrNome(o.criadoPor))} em ${fDH(o.criadoEm)}</span></div><div class="kv">
    ${kv('Cliente',esc(cliNome(o.clienteId)))}${kv('Data prevista',fISO(o.dataPrevista))}
    ${o.tipo==='recebimento'?kv('Entrada',ENTRADAS[o.entrada])+kv('Finalidade',finNome(o)):''}
    ${o.tipo==='carregamento'?kv('Sai',o.objeto==='conteiner'?'Contêiner':'Carga do armazém'):''}
    ${o.tipo==='recebimento'&&o.cntr?.numero?kv('Contêiner',esc(`${o.cntr.numero} ${o.cntr.tipo||''}`))+kv('Lacre informado',esc(o.cntr.lacre||'—'))+kv('Armador',esc(o.cntr.armador||'')):''}
    ${['desova','transbordo'].includes(o.tipo)||(o.tipo==='carregamento'&&o.objeto==='conteiner')?kv(o.tipo==='transbordo'?'CNTR origem':'Contêiner',esc(`${k?.numero||'?'} ${k?.tipo||''}`))+kv('Lacre',esc(k?.lacre||'—')):''}
    ${['transbordo','estufagem'].includes(o.tipo)?kv('CNTR destino',esc(`${o.cntr?.numero||''} ${o.cntr?.tipo||''}`)):''}
    ${o.liberadoEm?kv('Liberado no gate',`${fDH(o.liberadoEm)} · ${esc(usrNome(o.liberadoPor))}`):''}
  </div>`;
  if(o.veiculo?.placa||o.veiculo?.motorista)b+=`<div class="sec">Veículo</div><div class="kv">${kv('Placa',esc(o.veiculo.placa))}${kv('Carreta',esc(o.veiculo.carreta))}${kv('Motorista',esc(o.veiculo.motorista))}${kv('CPF',esc(o.veiculo.cpf))}${kv('Transportadora',esc(o.veiculo.transportadora))}</div>`;
  if(o.status!=='finalizada'){
    if(o.nfs?.length)b+=`<div class="sec">NFs declaradas</div><div class="tw"><table><thead><tr><th>NF</th><th>Emitente</th><th>Mercadoria</th><th class="n">Volumes</th><th class="n">Peso (kg)</th>${verValor()?'<th class="n">Valor</th>':''}</tr></thead><tbody>${o.nfs.map(n=>`<tr><td><b>${esc(n.nf)}</b></td><td>${esc(n.emitente)}</td><td>${esc(n.mercadoria)}</td><td class="n">${fN(n.volumes)}</td><td class="n">${fN(n.peso,1)}</td>${verValor()?`<td class="n">${fR(valorNF(o.id,n.k))}</td>`:''}</tr>`).join('')}</tbody></table></div>`;
    if(o.itens?.length)b+=`<div class="sec">Carga programada</div><div class="tw"><table><thead><tr><th>NF</th><th>Mercadoria</th><th class="n">Volumes</th><th class="n">Peso (kg)</th><th class="n">Saldo atual</th></tr></thead><tbody>${o.itens.map(i=>{const c=G('cargas',i.cargaId)||{};return `<tr><td><b>${esc(i.nf)}</b></td><td>${esc(c.mercadoria||'')}</td><td class="n">${fN(i.volumes)}</td><td class="n">${fN(i.peso,1)}</td><td class="n">${fN(c.saldoVol)}</td></tr>`}).join('')}</tbody></table></div>`;
    if(['desova','transbordo'].includes(o.tipo)&&k)b+=cargasCntrTabela(k.id);
  }
  if(o.status==='execucao')b+=`<div class="alert i" style="margin-top:12px">Em execução por ${esc(usrNome(o.conferenteId))} desde ${fDH(o.inicioEm)}</div>`;
  if(o.status==='finalizada'&&o.baixa){
    const x=o.baixa;
    if(x.modo==='documento')b+=`<div class="sec">Confirmada pela O.S. assinada</div><div class="kv">${kv('Conferente (no documento)',esc(x.conferenteDoc))}${kv('Confirmado por',esc(usrNome(x.confirmadoPor))+' · '+fDH(x.confirmadoEm))}${kv('Data/hora da operação',fDH(o.fimEm))}${kv('Operador',o.operadorId?esc(opNome(o.operadorId)):'')}${kv('Lacre conferido',esc(x.lacreConferido))}${kv('Novo lacre',esc(x.lacreNovo))}${kv('Localização',esc(x.localizacao))}</div>`;
    else b+=`<div class="sec">Baixa do conferente</div><div class="kv">${kv('Conferente',esc(usrNome(o.conferenteId)))}${kv('Operador',esc(opNome(o.operadorId)))}${kv('Equipamento',o.equipamentoId?esc(eqNome(o.equipamentoId)):'')}${kv('Início',fDH(o.inicioEm))}${kv('Fim',fDH(o.fimEm))}${kv('Duração',dur(o.fimEm-o.inicioEm))}${kv('Lacre conferido',esc(x.lacreConferido))}${kv('Novo lacre',esc(x.lacreNovo))}${kv('Localização',esc(x.localizacao))}</div>`;
    if(x.linhas?.length)b+=`<div style="margin-top:12px">${linhasHTML(x.linhas)}</div>`;
    if(x.avaria)b+=`<div class="sec">Avarias / desvios</div><div>${esc(x.avaria)}</div>`;
    if(x.obs)b+=`<div class="sec">Observações da baixa</div><div>${esc(x.obs)}</div>`;
    if(x.fotos?.length)b+=`<div class="sec">Fotos</div><div class="fotos">${x.fotos.map((p,i)=>`<img src="${p}" data-act="fotoVer" data-os="${o.id}" data-i="${i}">`).join('')}</div>`;
  }
  if(o.obs)b+=`<div class="sec">Observações</div><div>${esc(o.obs)}</div>`;
  if(o.status==='cancelada')b+=`<div class="alert" style="margin-top:12px">Cancelada por ${esc(usrNome(o.canceladoPor))} em ${fDH(o.canceladoEm)} · ${esc(o.motivoCancel||'')}</div>`;
  const a=[];
  if(['pre','aberta','execucao'].includes(o.status)&&tem('programacao'))a.push(`<button class="btn danger" data-act="cancelar" data-id="${o.id}">Cancelar O.S.</button>`);
  if(['pre','aberta'].includes(o.status)&&tem('programacao'))a.push(`<button class="btn" data-act="altData" data-id="${o.id}">Alterar data</button>`);
  if(o.status!=='cancelada')a.push(`<button class="btn" data-act="imprimir" data-id="${o.id}">Imprimir</button>`);
  if(o.status==='pre'&&tem('gate','programacao'))a.push(`<button class="btn p" data-act="liberar" data-id="${o.id}">Veículo chegou · liberar</button>`);
  if(baixaConf()){
    if(o.status==='aberta'&&tem('conferencia','programacao'))a.push(`<button class="btn d" data-act="iniciar" data-id="${o.id}">Iniciar</button>`);
    if(['aberta','execucao'].includes(o.status)&&tem('conferencia','programacao'))a.push(`<button class="btn p" data-act="baixa" data-id="${o.id}">Dar baixa</button>`);
  }else if(['aberta','execucao'].includes(o.status)&&tem('programacao'))a.push(`<button class="btn p" data-act="baixa" data-id="${o.id}">Confirmar O.S. assinada</button>`);
  const html=shell(`${o.numero} · ${TIPOS[o.tipo]}`,b,a.join(''));
  if(App.modal)setModal(html);else openModal(html,true);
}
function printOS(id){
  const o=G('os',id);if(!o)return;
  const el=$('#print');el.innerHTML=printHTML(o);
  const q=el.querySelector('.qr');
  try{new QRCode(q,{text:o.numero,width:120,height:120,correctLevel:QRCode.CorrectLevel.M})}catch(e){q.textContent=o.numero}
  setTimeout(()=>window.print(),450);
}

  </div>
  ${linhas.length?`<div class="sect">Carga</div><table style="width:100%;border-collapse:collapse"><thead><tr><th>NF</th><th>Mercadoria</th><th>Volumes</th><th>Peso (kg)</th><th>Vol. conferido</th><th>Avarias</th></tr></thead><tbody>${linhas.map(l=>`<tr><td>${esc(l[0])}</td><td>${esc(l[1]||'')}</td><td style="text-align:right">${fN(l[2])}</td><td style="text-align:right">${fN(l[3],1)}</td><td></td><td></td></tr>`).join('')}</tbody></table>`:''}
  ${o.obs?`<div class="sect">Observações</div><div>${esc(o.obs)}</div>`:''}

const soCpf = v=>String(v||'').replace(/\D/g,'');
function cpfValido(c){c=soCpf(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;const d=k=>{let s=0;for(let i=0;i<k;i++)s+=+c[i]*(k+1-i);const r=(s*10)%11;return r===10?0:r};return d(9)===+c[9]&&d(10)===+c[10]}
const fCpf = c=>{c=soCpf(c);return c.length===11?`${c.slice(0,3)}.${c.slice(3,6)}.${c.slice(6,9)}-${c.slice(9)}`:c};
async function emailDoLogin(v){
  v=String(v||'').trim();
  if(v.includes('@'))return v;
  const c=soCpf(v);if(c.length!==11)throw new Error('Informe o CPF com 11 números');
  const d=await FB.db.collection('logins').doc(c).get();
  if(!d.exists)throw new Error('CPF não cadastrado');
  return d.data().email;
}

};

ACT.salvarOS=async()=>{
  const f=App.form,veic=cleanVeic(f.veiculo);let e='';
  const os={id:uid(),tipo:f.tipo,clienteId:f.clienteId,dataPrevista:f.modoGate?hojeISO():(f.dataPrevista||hojeISO()),obs:String(f.obs||'').trim(),criadoPor:App.user.id,criadoEm:now()};
  if(!f.clienteId)e='Selecione o cliente';
  else if(f.tipo==='recebimento'){
    os.entrada=f.entrada;os.finalidade=f.finalidade||'';os.veiculo=veic;
    if(!f.entrada)e='Informe o tipo de entrada';
    else{
      if(f.entrada!=='carga_solta'){const n=normCntr(f.cntr.numero);e=validaCntrEntrada(n);os.cntr={numero:n,tipo:f.cntr.tipo,lacre:String(f.cntr.lacre||'').trim(),armador:String(f.cntr.armador||'').trim()}}
      if(!e&&f.entrada!=='cntr_vazio'){
        if(f.nfs.some(n=>!String(n.nf||'').trim()&&(n.volumes||n.mercadoria||n.peso)))e='Há NF sem número';
        os.nfs=cleanNfs(f.nfs);
        if(!e&&f.entrada==='carga_solta'&&f.modoGate&&!os.nfs.length)e='Lance ao menos uma NF';
      }
      if(!e&&f.modoGate){if(!veic.placa)e='Informe a placa';else if(!veic.motorista)e='Informe o motorista'}
    }
  }else if(f.tipo==='desova'){
    os.conteinerId=f.conteinerId;if(!G('conteineres',f.conteinerId))e='Selecione o contêiner';
  }else if(f.tipo==='transbordo'){
    os.conteinerId=f.conteinerId;
    if(!G('conteineres',f.conteinerId))e='Selecione o contêiner de origem';else e=validaDestino(f,f.conteinerId);
    os.cntr={numero:normCntr(f.cntr.numero),tipo:f.cntr.tipo};
  }else if(f.tipo==='estufagem'){
    e=validaDestino(f,null);os.cntr={numero:normCntr(f.cntr.numero),tipo:f.cntr.tipo};
    if(!e){os.itens=selItens(f);e=validaItens(os.itens)}
  }else if(f.tipo==='carregamento'){
    os.objeto=f.objeto;os.veiculo=veic;
    if(f.objeto==='conteiner'){os.conteinerId=f.conteinerId;if(!G('conteineres',f.conteinerId))e='Selecione o contêiner'}
    else{os.itens=selItens(f);e=validaItens(os.itens)}
  }
  if(e)return toast(e,'err');
  const seq=await S.next('os');os.seq=seq;os.numero='OS-'+String(seq).padStart(6,'0');
  if(['recebimento','carregamento'].includes(os.tipo)){if(f.modoGate){os.status='aberta';os.liberadoPor=App.user.id;os.liberadoEm=now()}else os.status='pre'}
  else os.status='aberta';
  const ops=[['set','os',os]];const vo=separarValores(os);if(vo)ops.push(['merge','valores',vo]);
  await S.batch(ops);closeModal();toast(`${os.numero} criada`,'ok');
  printOS(os.id);
};

ACT.salvarLiberar=async()=>{
  const f=App.form,o=G('os',f.osId),veic=cleanVeic(f.veiculo);
  if(!o||o.status!=='pre')return toast('Esta O.S. já foi liberada','err');
  if(!veic.placa)return toast('Informe a placa','err');
  if(!veic.motorista)return toast('Informe o motorista','err');
  const up2={...o,veiculo:veic,status:'aberta',liberadoPor:App.user.id,liberadoEm:now()};
  if(o.tipo==='recebimento'){
    if(o.entrada!=='carga_solta'){const n=normCntr(f.cntr.numero),e=validaCntrEntrada(n,o.id);if(e)return toast(e,'err');up2.cntr={numero:n,tipo:f.cntr.tipo,lacre:String(f.cntr.lacre||'').trim(),armador:String(f.cntr.armador||'').trim()}}
    if(o.entrada!=='cntr_vazio'){
      if(f.nfs.some(n=>!String(n.nf||'').trim()&&(n.volumes||n.mercadoria||n.peso)))return toast('Há NF sem número','err');
      up2.nfs=cleanNfs(f.nfs);if(o.entrada==='carga_solta'&&!up2.nfs.length)return toast('Lance ao menos uma NF','err');
    }
  }
  if(o.tipo==='carregamento'&&o.objeto==='conteiner'){const k=G('conteineres',o.conteinerId);if(!k||k.status!=='terminal')return toast('Contêiner não está mais no terminal','err')}
  const ops=[['set','os',up2]];const vo=separarValores(up2);if(vo)ops.push(['merge','valores',vo]);
  await S.batch(ops);closeModal();toast(`${o.numero} liberada`,'ok');printOS(o.id);
};

ACT.baixa=d=>{

  if(!baixaConf()){if(!tem('programacao'))return toast('Quem confirma a O.S. assinada é o analista','err');const d0=new Date();d0.setMinutes(d0.getMinutes()-d0.getTimezoneOffset());Object.assign(f,{modo:'documento',conferenteDoc:'',assinado:false,dataHora:d0.toISOString().slice(0,16)})}

  return shell((doc?'Confirmar O.S. assinada · ':'Baixa · ')+o.numero,b,`<button class="btn" data-act="close">Cancelar</button><button class="btn p" data-act="finalizar">${doc?'Confirmar e finalizar O.S.':'Finalizar O.S.'}</button>`);

async function addFotos(el){
  const f=App.form;if(!f)return;
  for(const file of [...el.files]){if(f.fotos.length>=4)break;try{f.fotos.push(await compress(file))}catch(e){toast('Falha ao ler a foto','err')}}
  renderForm();
}
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.55))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

ACT.finalizar=async()=>{
  const f=App.form,o=G('os',f.osId);
  if(!o||!['aberta','execucao'].includes(o.status))return toast('Esta O.S. não está mais aberta','err');
  const doc=f.modo==='documento';
  if(doc){
    if(!f.assinado)return toast('Marque que recebeu a O.S. assinada pelo motorista','err');
    if(!String(f.conferenteDoc||'').trim())return toast('Informe o conferente que assinou','err');
    if(!f.dataHora)return toast('Informe a data e hora da operação','err');
    if(new Date(f.dataHora).getTime()>now()+60000)return toast('Data/hora da operação está no futuro','err');
  }else if(!f.operadorId)return toast('Informe o operador','err');
  const conta=contaFisico(o);
  if(conta){
    if(!f.linhas.length)return toast('Informe ao menos uma NF','err');
    for(const l of f.linhas){
      if(l.nova&&!String(l.nf||'').trim())return toast('Informe o nº da NF não declarada','err');
      if(l.vol===''||l.vol==null)return toast(`Informe os volumes da NF ${l.nf}`,'err');
      if(['estufagem','carregamento'].includes(o.tipo)){const c=G('cargas',l.cargaId);if(!c||num(l.vol)>num(c.saldoVol))return toast(`NF ${l.nf}: maior que o saldo (${fN(c?.saldoVol)})`,'err')}
    }
  }
  if(['transbordo','estufagem'].includes(o.tipo)&&!String(f.lacreNovo||'').trim())return toast('Informe o novo lacre','err');
  if(['transbordo','estufagem'].includes(o.tipo)&&L('os').some(x=>x.tipo==='recebimento'&&ATIVAS.includes(x.status)&&x.cntr?.numero===o.cntr?.numero))return toast(`Dê baixa primeiro no recebimento do contêiner ${o.cntr.numero}`,'err');
  if(['desova','transbordo'].includes(o.tipo)||(o.tipo==='carregamento'&&o.objeto==='conteiner')){const k=G('conteineres',o.conteinerId);if(!k||k.status!=='terminal')return toast('Contêiner não está no terminal','err')}
  if(o.tipo==='recebimento'&&o.cntr?.numero&&cntrTerminal().some(k=>k.numero===o.cntr.numero))return toast(`Contêiner ${o.cntr.numero} já está no terminal`,'err');
  if(!confirm(doc?`Confirmar ${o.numero} pela O.S. assinada?`:`Finalizar ${o.numero}?`))return;
  const t=doc?new Date(f.dataHora).getTime():now();
  const pesoDe=l=>l.peso!==''&&l.peso!=null?num(l.peso):(num(l.volDecl)?r2(num(l.pesoDecl)*num(l.vol)/num(l.volDecl)):0);
  const bx={linhas:f.linhas.map(l=>({k:l.k,cargaId:l.cargaId||null,nova:!!l.nova,nf:String(l.nf||'').trim(),emitente:l.emitente||'',mercadoria:String(l.mercadoria||'').trim(),nfK:l.nfK||null,volDecl:num(l.volDecl),pesoDecl:num(l.pesoDecl),vol:num(l.vol),peso:pesoDe(l),avariados:num(l.avariados)})),
    ...(doc?{modo:'documento',conferenteDoc:String(f.conferenteDoc).trim().toUpperCase(),confirmadoPor:App.user.id,confirmadoEm:now()}:{}),lacreConferido:String(f.lacreConferido||'').trim(),lacreNovo:String(f.lacreNovo||'').trim(),avaria:String(f.avaria||'').trim(),obs:String(f.obs||'').trim(),localizacao:String(f.localizacao||'').trim(),fotos:f.fotos};
  if(!conta)bx.linhas=[];
  const ops=aplicarBaixa(o,bx,t);
  ops.push(['set','os',{...o,status:'finalizada',conferenteId:o.conferenteId||App.user.id,finalizadoPor:App.user.id,inicioEm:doc?(o.inicioEm||o.liberadoEm||t):(o.inicioEm||f.inicioEm),fimEm:t,operadorId:f.operadorId,equipamentoId:f.equipamentoId||'',baixa:bx}]);
  await S.batch(ops);closeModal();toast(doc?`${o.numero} confirmada pela O.S. assinada`:`${o.numero} finalizada`,'ok');
};

async function criarLogin(cpf,senha,n){
  const email=`${cpf}${n>1?'.'+n:''}@${LOGIN_DOMINIO}`;
  const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');
  const cr=await sec.auth().createUserWithEmailAndPassword(email,senha);await sec.auth().signOut();
  return {uid:cr.user.uid,email};
}
ACT.usrSave=async()=>{
  const f=App.form,nome=String(f.nome||'').trim();
  if(!nome)return toast('Informe o nome','err');
  const prev=f.id?G('usuarios',f.id):null;
  if(prev){
    if(prev.id===App.user.id&&(f.ativo===false||(prev.perfil!=='gestao'&&!f.acessos.includes('usuarios'))))return toast('Você não pode tirar seu próprio acesso a Usuários','err');
    const o={...prev,nome,ativo:f.ativo!==false};
    if(prev.perfil!=='gestao')o.acessos=f.acessos;
    await S.put('usuarios',o);closeModal();toast('Usuário salvo','ok');return;
  }
  const cpf=soCpf(f.cpf);
  if(!cpfValido(cpf))return toast('CPF inválido','err');
  if(L('usuarios').some(u=>u.cpf===cpf&&!u.substituidoPor))return toast('Já existe usuário com esse CPF','err');
  if(!f.acessos.length)return toast('Marque ao menos um acesso','err');
  let id,email='';
  if(MODO_DEMO)id=uid();
  else{
    if(String(f.senha||'').length<6)return toast('Senha inicial com no mínimo 6 caracteres','err');
    try{const r=await criarLogin(cpf,f.senha,1);id=r.uid;email=r.email}
    catch(err){if(err.code==='auth/email-already-in-use'){const r=await criarLogin(cpf,f.senha,Date.now()%100000);id=r.uid;email=r.email}else throw err}
  }
  const ops=[['set','usuarios',{id,nome,cpf,email,acessos:f.acessos,ativo:f.ativo!==false,criadoEm:now()}]];
  if(!MODO_DEMO)ops.push(['set','logins',{id:cpf,email,uid:id}]);
  await S.batch(ops);closeModal();toast('Usuário criado','ok');
};
ACT.usrNovaSenha=async d=>{
  const u=G('usuarios',d.id);if(!u||!u.cpf)return;
  const s=prompt(`Nova senha para ${u.nome} (mín. 6 caracteres):`);if(s===null)return;
  if(s.length<6)return toast('Senha com no mínimo 6 caracteres','err');
  const n=(u.loginSeq||1)+1;
  let r;try{r=await criarLogin(u.cpf,s,n)}catch(err){if(err.code==='auth/email-already-in-use')r=await criarLogin(u.cpf,s,n+Date.now()%1000);else throw err}
  const novo={...u,id:r.uid,email:r.email,loginSeq:n,loginAnterior:u.id};delete novo.substituidoPor;
  await S.batch([['set','usuarios',novo],['set','usuarios',{...u,ativo:false,substituidoPor:r.uid}],['set','logins',{id:u.cpf,email:r.email,uid:r.uid}]]);
  closeModal();toast(`Senha redefinida. Passe a nova senha para ${u.nome}.`,'ok');
};
